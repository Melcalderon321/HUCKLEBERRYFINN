 engañado.", "hint": "Observá cómo se comporta la gente en grupo y qué la atrae como espectáculo."}, {"id": "22-5", "chapter": 22, "q": "¿Qué frase usan los impostores para despertar curiosidad por su nuevo espectáculo?", "options": ["Que no se admite a mujeres ni niños", "Que la entrada es gratuita", "Que actuará el juez Thatcher", "Que se sortea la balsa de Jim"], "explanation": "Tras el fracaso del Shakespeare, el duque anuncia el Royal Nonesuch y usa la prohibición como reclamo publicitario.", "hint": "Observá cómo se comporta la gente en grupo y qué la atrae como espectáculo."}]}, {"n": 23, "title": "El engaño y la familia de Jim", "summary": "El Royal Nonesuch estafa al público. En la balsa, Jim recuerda a su familia y el dolor que siente por su hija.", "questions": [{"id": "23-1", "chapter": 23, "q": "¿En qué consiste realmente el Royal Nonesuch?", "options": ["Una actuación brevísima y ridícula del rey", "Una obra completa de Shakespeare", "Un concierto de los Wilks", "Una lección de navegación de Jim"], "explanation": "La promesa de un gran espectáculo encubre una burla de pocos minutos por la que cobran entrada.", "hint": "Este capítulo contrapone la codicia de los impostores con los sentimientos de Jim."}, {"id": "23-2", "chapter": 23, "q": "¿Por qué los primeros espectadores animan a otros a ir?", "options": ["Para que otros sean engañados y no quedar solos en la vergüenza", "Porque reciben una entrada gratis", "Porque desconocen cómo termina la función", "Porque Jim les pide ayuda"], "explanation": "El orgullo herido los lleva a extender el fraude en vez de advertir a sus vecinos.", "hint": "Este capítulo contrapone la codicia de los impostores con los sentimientos de Jim."}, {"id": "23-3", "chapter": 23, "q": "¿Qué hacen los estafadores cuando esperan una venganza del público?", "options": ["Escapan con la recaudación", "Devuelven todas las entradas", "Denuncian a Huck", "Piden protección al juez"], "explanation": "En la tercera noche, prevén que el público irá preparado para atacarlos y se marchan antes de exponerse.", "hint": "Este capítulo contrapone la codicia de los impostores con los sentimientos de Jim."}, {"id": "23-4", "chapter": 23, "q": "¿Qué comprende Huck al ver la tristeza de Jim por su familia?", "options": ["Que siente el mismo amor familiar que cualquier padre", "Que Jim olvidó a sus hijos", "Que solo quiere recuperar una deuda", "Que desea abandonar a su esposa"], "explanation": "Huck empieza a reconocer con mayor claridad la humanidad y el afecto de Jim, frente a los prejuicios que aprendió.", "hint": "Este capítulo contrapone la codicia de los impostores con los sentimientos de Jim."}, {"id": "23-5", "chapter": 23, "q": "¿Por qué Jim se arrepiente de haber castigado a su hija Elizabeth?", "options": ["Descubrió que no lo oía tras haber tenido escarlatina", "Descubrió que Tom le había pagado", "Supo que estaba buscando el tesoro", "Supo que Watson le había dado permiso"], "explanation": "Jim confundió la falta de respuesta con desobediencia y luego comprendió que su hija había quedado sorda.", "hint": "Este capítulo contrapone la codicia de los impostores con los sentimientos de Jim."}]}, {"n": 24, "title": "La oportunidad de los Wilks", "summary": "El rey obtiene información sobre una familia de duelo. Los estafadores preparan una suplantación de identidad.", "questions": [{"id": "24-1", "chapter": 24, "q": "¿Qué cambio hace el duque para que Jim no tenga que estar siempre atado?", "options": ["Lo disfraza y lo presenta como un hombre peligroso que no deben molestar", "Lo envía a vivir con el juez", "Le consigue un documento auténtico de libertad", "Lo oculta en casa de los Wilks"], "explanation": "El disfraz y el aviso buscan alejar curiosos de la balsa; no le otorgan libertad legal a Jim.", "hint": "La información que reciben de un joven les permite fingir parentesco."}, {"id": "24-2", "chapter": 24, "q": "¿Qué noticia obtiene el rey de un joven con el que conversa?", "options": ["Que Peter Wilks murió y esperan a sus hermanos ingleses", "Que la viuda Douglas se mudó a Francia", "Que Pap ganó el juicio del dinero", "Que Tom fue elegido alcalde"], "explanation": "El joven le da nombres y detalles familiares que el rey convierte en material para una nueva estafa.", "hint": "La información que reciben de un joven les permite fingir parentesco."}, {"id": "24-3", "chapter": 24, "q": "¿Qué planean fingir el rey y el duque?", "options": ["Ser los hermanos de Peter Wilks", "Ser los hijos del juez Thatcher", "Ser médicos de la viuda", "Ser dueños del Walter Scott"], "explanation": "Se presentan como Harvey y William Wilks para aprovechar la llegada esperada de los parientes.", "hint": "La información que reciben de un joven les permite fingir parentesco."}, {"id": "24-4", "chapter": 24, "q": "¿Qué condición finge el duque al hacerse pasar por William?", "options": ["No poder oír ni hablar", "No poder caminar", "No poder ver", "Haber perdido la memoria"], "explanation": "La supuesta sordera y falta de habla le permiten evitar conversaciones que podrían delatarlo.", "hint": "La información que reciben de un joven les permite fingir parentesco."}, {"id": "24-5", "chapter": 24, "q": "¿Qué siente Huck ante el fingido dolor de los impostores?", "options": ["Vergüenza por la conducta humana", "Orgullo por su honestidad", "Deseo de convertirse en rey", "Alegría por la libertad de Jim"], "explanation": "Huck ve que explotan el duelo de una familia y considera especialmente repugnante esa actuación.", "hint": "La información que reciben de un joven les permite fingir parentesco."}]}, {"n": 25, "title": "La herencia y la confianza", "summary": "Las sobrinas reciben a los falsos tíos. El doctor sospecha, pero Mary Jane demuestra su confianza entregándoles el dinero.", "questions": [{"id": "25-1", "chapter": 25, "q": "¿Quiénes son Mary Jane, Susan y Joanna?", "options": ["Las sobrinas de Peter Wilks", "Las hermanas de Jim", "Las hijas del juez Thatcher", "Las primas de Buck"], "explanation": "Las tres jóvenes están de duelo y creen recibir a sus tíos llegados de Inglaterra.", "hint": "La confianza de las muchachas hace que el fraude sea especialmente cruel."}, {"id": "25-2", "chapter": 25, "q": "¿Dónde dejó Peter una importante cantidad de dinero?", "options": ["En el sótano", "Dentro de la bola de pelo", "En la balsa de Jim", "En el sombrero de Tom"], "explanation": "Las instrucciones de Peter permiten encontrar el dinero que los impostores pretenden administrar.", "hint": "La confianza de las muchachas hace que el fraude sea especialmente cruel."}, {"id": "25-3", "chapter": 25, "q": "¿Qué hacen los estafadores cuando la cantidad encontrada no coincide con la anunciada?", "options": ["Completan la diferencia con su propio dinero", "Acusan de inmediato a Mary Jane", "Renuncian a toda la herencia", "Piden al juez que imprima billetes"], "explanation": "Aportan la diferencia para no despertar sospechas y sostener su imagen de parientes generosos.", "hint": "La confianza de las muchachas hace que el fraude sea especialmente cruel."}, {"id": "25-4", "chapter": 25, "q": "¿Quién acusa a los supuestos hermanos de ser impostores?", "options": ["El doctor Robinson", "La tía Sally", "El coronel Grangerford", "Ben Rogers"], "explanation": "El médico desconfía de la forma de hablar y del comportamiento del rey, y advierte a las jóvenes.", "hint": "La confianza de las muchachas hace que el fraude sea especialmente cruel."}, {"id": "25-5", "chapter": 25, "q": "¿Cómo responde Mary Jane a la acusación del doctor?", "options": ["Entrega el dinero a los supuestos tíos como muestra de confianza", "Se marcha con el doctor a la cárcel", "Quema el testamento de Peter", "Le pide a Jim que esconda la herencia"], "explanation": "Su gesto revela una confianza que los estafadores no merecen y refuerza el deseo de Huck de protegerla.", "hint": "La confianza de las muchachas hace que el fraude sea especialmente cruel."}]}, {"n": 26, "title": "Huck decide intervenir", "summary": "Las preguntas de Joanna ponen en apuros a Huck. La bondad de las hermanas lo impulsa a recuperar el dinero.", "questions": [{"id": "26-1", "chapter": 26, "q": "¿Por qué Joanna hace pasar un mal momento a Huck?", "options": ["Le pregunta detalles de Inglaterra que él no conoce", "Lo reconoce como amigo de Buck", "Le exige reparar la balsa", "Le pregunta dónde está Pap"], "explanation": "Huck debe sostener su identidad como acompañante inglés y sus invenciones empiezan a contradecirse.", "hint": "Huck cambia de observador incómodo a alguien que actúa contra el fraude."}, {"id": "26-2", "chapter": 26, "q": "¿Cómo reaccionan Mary Jane y Susan al trato de Joanna hacia Huck?", "options": ["La reprenden y procuran que lo trate con amabilidad", "Se suman a las burlas", "Lo entregan al sheriff", "Lo expulsan de la casa"], "explanation": "La defensa de Huck por parte de las muchachas hace que se sienta aún más culpable por participar en el engaño.", "hint": "Huck cambia de observador incómodo a alguien que actúa contra el fraude."}, {"id": "26-3", "chapter": 26, "q": "¿Qué decide hacer Huck por las hermanas?", "options": ["Recuperar el dinero de los estafadores", "Venderlas como actrices al duque", "Llevarlas a la isla con Pap", "Convencerlas de abandonar la herencia"], "explanation": "La bondad que recibe lo mueve a sabotear el robo y a tratar de devolverles lo que les pertenece.", "hint": "Huck cambia de observador incómodo a alguien que actúa contra el fraude."}, {"id": "26-4", "chapter": 26, "q": "¿Qué escucha Huck mientras se esconde?", "options": ["La discusión de los impostores sobre el dinero y sus planes", "Una confesión de Jim sobre Pap", "Una orden del juez de vender la casa", "Un acuerdo de Mary Jane con Tom"], "explanation": "Al espiarlos, Huck descubre dónde guardan el dinero y cómo piensan continuar explotando la situación.", "hint": "Huck cambia de observador incómodo a alguien que actúa contra el fraude."}, {"id": "26-5", "chapter": 26, "q": "¿Dónde encuentra finalmente Huck la bolsa que roba a los estafadores?", "options": ["Escondida en la cama del rey", "Dentro del piano de Emmeline", "En la canoa de Jim", "En la oficina del doctor"], "explanation": "Tras oír a los impostores, Huck recupera la bolsa y busca una manera de ponerla fuera de su alcance.", "hint": "Huck cambia de observador incómodo a alguien que actúa contra el fraude."}]}, {"n": 27, "title": "El dinero en el ataúd", "summary": "Huck esconde la bolsa en el ataúd de Peter. La venta de personas esclavizadas provoca dolor y los impostores buscan el dinero.", "questions": [{"id": "27-1", "chapter": 27, "q": "¿Dónde esconde Huck el dinero al oír pasos?", "options": ["En el ataúd de Peter Wilks", "En el pozo de los Phelps", "En la maleta del doctor", "En un árbol de la isla"], "explanation": "La llegada de alguien lo obliga a improvisar y usa el ataúd como escondite inmediato.", "hint": "Seguí el recorrido de la bolsa y qué creen los impostores cuando desaparece."}, {"id": "27-2", "chapter": 27, "q": "¿Qué impide que Huck recupere fácilmente la bolsa después?", "options": ["Cierran y entierran el ataúd", "Jim se lleva la bolsa al norte", "La viuda compra la casa", "Tom quema el escondite"], "explanation": "Huck no logra sacar el dinero antes del entierro y queda inseguro sobre lo que pasará con él.", "hint": "Seguí el recorrido de la bolsa y qué creen los impostores cuando desaparece."}, {"id": "27-3", "chapter": 27, "q": "¿Qué acto de los estafadores entristece especialmente a las hermanas?", "options": ["Venden a personas esclavizadas separando a una familia", "Regalan los cuadros del salón", "Cancelan una función de circo", "Ocultan una visita del doctor"], "explanation": "La separación de una madre y sus hijos muestra la crueldad de tratar a las personas como bienes de una herencia.", "hint": "Seguí el recorrido de la bolsa y qué creen los impostores cuando desaparece."}, {"id": "27-4", "chapter": 27, "q": "¿Qué pretende hacer el rey con los bienes de los Wilks?", "options": ["Venderlos rápidamente y marcharse", "Convertirlos en una escuela gratuita", "Devolverlos todos al doctor", "Administrarlos durante veinte años"], "explanation": "La urgencia por liquidar los bienes responde a su intención de obtener dinero antes de que el fraude se descubra.", "hint": "Seguí el recorrido de la bolsa y qué creen los impostores cuando desaparece."}, {"id": "27-5", "chapter": 27, "q": "¿A quién hace creer Huck que pudo llevarse el dinero?", "options": ["A las personas esclavizadas que ya fueron vendidas", "A Mary Jane y al doctor juntos", "A Tom y la tía Polly", "Al juez Thatcher"], "explanation": "Huck dirige las sospechas hacia personas que ya están lejos, de modo que los impostores no puedan castigarlas allí.", "hint": "Seguí el recorrido de la bolsa y qué creen los impostores cuando desaparece."}]}, {"n": 28, "title": "Decir la verdad a Mary Jane", "summary": "Huck le revela el fraude a Mary Jane y prepara un plan. La aparición de los verdaderos hermanos complica todo.", "questions": [{"id": "28-1", "chapter": 28, "q": "¿Qué provoca la conversación sincera de Huck con Mary Jane?", "options": ["El dolor de ella por la familia separada en la venta", "El deseo de ella de comprar un circo", "Una carta de Pap desde la isla", "Una discusión sobre el idioma francés"], "explanation": "Huck intenta tranquilizarla y acaba revelándole que sus supuestos tíos son estafadores.", "hint": "La verdad de Huck debe combinarse con un plan para proteger también a Jim."}, {"id": "28-2", "chapter": 28, "q": "¿Qué le confiesa Huck sobre el rey y el duque?", "options": ["Que no son sus tíos y buscan robarles", "Que son reyes auténticos sin fortuna", "Que trabajan para el doctor", "Que son hermanos de Jim"], "explanation": "Huck elige confiar en Mary Jane y rompe su colaboración silenciosa con los impostores.", "hint": "La verdad de Huck debe combinarse con un plan para proteger también a Jim."}, {"id": "28-3", "chapter": 28, "q": "¿Por qué pide Huck que Mary Jane se ausente un tiempo?", "options": ["Para que no delate el plan con su reacción", "Para que viaje de inmediato a Francia", "Para que ayude a Pap a escapar", "Para que venda la balsa"], "explanation": "Huck teme que su indignación y su sinceridad revelen demasiado pronto lo que sabe.", "hint": "La verdad de Huck debe combinarse con un plan para proteger también a Jim."}, {"id": "28-4", "chapter": 28, "q": "¿Qué información deja Huck para que se recupere el dinero?", "options": ["Que lo escondió en el ataúd de Peter", "Que lo depositó el juez Thatcher", "Que Tom lo enterró en la isla", "Que Jim lo llevó a Ohio"], "explanation": "El dato permite vincular la desaparición de la bolsa con el lugar donde Huck la dejó durante la noche.", "hint": "La verdad de Huck debe combinarse con un plan para proteger también a Jim."}, {"id": "28-5", "chapter": 28, "q": "¿Quiénes llegan al final y amenazan la estafa?", "options": ["Los verdaderos Harvey y William Wilks", "La viuda y la señorita Watson", "Pap y el juez Thatcher", "Buck y Sophia Grangerford"], "explanation": "La llegada de los auténticos hermanos obliga al pueblo a decidir entre dos pares de supuestos herederos.", "hint": "La verdad de Huck debe combinarse con un plan para proteger también a Jim."}]}, {"n": 29, "title": "La prueba en el cementerio", "summary": "El pueblo compara a los supuestos parientes. Al abrir la tumba aparece el dinero y Huck aprovecha el desconcierto para escapar.", "questions": [{"id": "29-1", "chapter": 29, "q": "¿Por qué hay dos pares de supuestos hermanos de Peter?", "options": ["Porque llegaron los hermanos auténticos además de los impostores", "Porque Peter tenía cuatro hermanos idénticos", "Porque Tom organiza una obra", "Porque el doctor contrató actores"], "explanation": "La coincidencia expone el fraude a una comprobación pública de identidades.", "hint": "La investigación pasa de las palabras y la escritura a revisar el cuerpo de Peter."}, {"id": "29-2", "chapter": 29, "q": "¿Qué dificulta usar la escritura del verdadero William como prueba?", "options": ["Tiene el brazo derecho lesionado", "No sabe leer ni escribir", "Perdió la vista durante el viaje", "Se niega a tomar una pluma por religión"], "explanation": "La lesión impide una comparación sencilla y ayuda a prolongar la confusión entre los vecinos.", "hint": "La investigación pasa de las palabras y la escritura a revisar el cuerpo de Peter."}, {"id": "29-3", "chapter": 29, "q": "¿Qué detalle del cuerpo de Peter se convierte en motivo de disputa?", "options": ["Un supuesto tatuaje en el pecho", "El color de sus zapatos", "Una cicatriz en la oreja", "La longitud de su cabello"], "explanation": "Los relatos sobre las marcas del pecho no coinciden y los presentes deciden comprobarlos en el cadáver.", "hint": "La investigación pasa de las palabras y la escritura a revisar el cuerpo de Peter."}, {"id": "29-4", "chapter": 29, "q": "¿Qué descubrimiento causa desconcierto al abrir el ataúd?", "options": ["La bolsa de dinero", "Una carta del rey de Francia", "El reloj del juez", "La sierra de Huck"], "explanation": "La aparición del dinero oculto concentra la atención de los presentes y permite que Huck se suelte y huya.", "hint": "La investigación pasa de las palabras y la escritura a revisar el cuerpo de Peter."}, {"id": "29-5", "chapter": 29, "q": "¿Por qué dura poco la alegría de Huck al volver con Jim?", "options": ["El rey y el duque alcanzan la balsa", "La balsa se incendia", "Jim decide entregarlo al juez", "Mary Jane se lleva a Jim"], "explanation": "Huck cree haberse librado de los impostores, pero los ve acercarse en su bote.", "hint": "La investigación pasa de las palabras y la escritura a revisar el cuerpo de Peter."}]}, {"n": 30, "title": "Acusaciones entre estafadores", "summary": "El rey amenaza a Huck y el duque interviene. Los impostores se culpan por la bolsa escondida.", "questions": [{"id": "30-1", "chapter": 30, "q": "¿Qué le reprocha el rey a Huck al subir a la balsa?", "options": ["Haber intentado abandonarlos", "Haber roto una corona verdadera", "Haber vendido su caballo", "Haber llamado a la tía Sally"], "explanation": "El rey reacciona violentamente porque sospecha que Huck quiso escapar de su compañía.", "hint": "Los dos interpretan el escondite según su propia desconfianza mutua."}, {"id": "30-2", "chapter": 30, "q": "¿Quién frena el ataque del rey contra Huck?", "options": ["El duque", "El juez", "Mary Jane", "Pap"], "explanation": "El duque interviene y la discusión se desplaza después hacia las sospechas entre los propios estafadores.", "hint": "Los dos interpretan el escondite según su propia desconfianza mutua."}, {"id": "30-3", "chapter": 30, "q": "¿De qué acusa el duque al rey?", "options": ["De haber escondido el dinero en el ataúd", "De haber liberado a Jim por dinero", "De ser el padre de Huck", "De haber escrito el testamento de Watson"], "explanation": "El duque cree que el rey buscaba quedarse solo con el dinero, sin saber que lo había escondido Huck.", "hint": "Los dos interpretan el escondite según su propia desconfianza mutua."}, {"id": "30-4", "chapter": 30, "q": "¿Por qué el rey acaba admitiendo que escondió la bolsa?", "options": ["Porque el duque lo presiona violentamente", "Porque ve a Huck declarando ante el juez", "Porque Mary Jane lo perdona", "Porque encuentra un recibo suyo"], "explanation": "La confesión es falsa y obtenida bajo presión; permite que el secreto de Huck siga sin descubrirse.", "hint": "Los dos interpretan el escondite según su propia desconfianza mutua."}, {"id": "30-5", "chapter": 30, "q": "¿Cómo termina la pelea entre los dos impostores?", "options": ["Se reconcilian mientras beben", "Se separan definitivamente en Cairo", "Devuelven la herencia a Jim", "Se entregan al sheriff"], "explanation": "Aunque desconfían uno del otro, vuelven a beber y a actuar como compañeros, mientras Huck le cuenta todo a Jim.", "hint": "Los dos interpretan el escondite según su propia desconfianza mutua."}]}, {"n": 31, "title": "La decisión de Huck", "summary": "El rey entrega a Jim a cambio de dinero. Huck piensa denunciarlo, pero elige su amistad y decide rescatarlo.", "questions": [{"id": "31-1", "chapter": 31, "q": "¿Qué descubre Huck al regresar y no encontrar a Jim?", "options": ["Que el rey lo ha entregado por dinero", "Que volvió voluntariamente con Watson", "Que compró un vapor hacia Ohio", "Que escapó con los hermanos Wilks"], "explanation": "El rey traiciona a Jim y lo entrega como supuesto fugitivo para cobrar dinero.", "hint": "Distinguí lo que Huck cree que está mal de la valoración que sus actos merecen."}, {"id": "31-2", "chapter": 31, "q": "¿Cuánto recibe el rey por entregar a Jim?", "options": ["Cuarenta dólares", "Seis mil dólares", "Un dólar", "Trescientos dólares"], "explanation": "Los cuarenta dólares muestran lo poco que le importa al rey la libertad de Jim frente a su codicia.", "hint": "Distinguí lo que Huck cree que está mal de la valoración que sus actos merecen."}, {"id": "31-3", "chapter": 31, "q": "¿A quién escribe Huck una carta antes de cambiar de decisión?", "options": ["A la señorita Watson", "A Mary Jane", "A la tía Polly", "Al coronel Grangerford"], "explanation": "Huck redacta una carta que revelaría dónde está Jim y permitiría devolverlo a la esclavitud.", "hint": "Distinguí lo que Huck cree que está mal de la valoración que sus actos merecen."}, {"id": "31-4", "chapter": 31, "q": "¿Qué hace Huck con la carta tras recordar su amistad con Jim?", "options": ["La rompe y decide ayudarlo", "La envía con el duque", "La entrega a Silas", "La esconde en el ataúd"], "explanation": "Los recuerdos del cuidado y la amistad de Jim pesan más que la norma esclavista que Huck aprendió como deber moral.", "hint": "Distinguí lo que Huck cree que está mal de la valoración que sus actos merecen."}, {"id": "31-5", "chapter": 31, "q": "¿Qué significa que Huck acepte incluso la condenación por ayudar a Jim?", "options": ["Elige a su amigo aunque cree desobedecer una obligación religiosa", "Decide que Jim debe ser castigado", "Comprende que el rey dice la verdad", "Promete obedecer siempre a Tom"], "explanation": "La ironía es que el acto compasivo le parece un pecado: el lector puede reconocer la injusticia de la moral que lo atormenta.", "hint": "Distinguí lo que Huck cree que está mal de la valoración que sus actos merecen."}, {"id": "31-6", "chapter": 31, "q": "¿Dónde averigua Huck que tienen a Jim?", "options": ["En la propiedad de Silas Phelps", "En la casa de los Grangerford", "En la cueva del tesoro", "En el circo de Arkansas"], "explanation": "La información sobre los Phelps da a Huck un destino concreto para su plan de rescate.", "hint": "Distinguí lo que Huck cree que está mal de la valoración que sus actos merecen."}]}, {"n": 32, "title": "Un nombre prestado en la granja", "summary": "Huck llega a casa de los Phelps y Sally lo confunde con Tom Sawyer. El parentesco le permite sostener la mentira.", "questions": [{"id": "32-1", "chapter": 32, "q": "¿Con quién confunde Sally Phelps a Huck?", "options": ["Con Tom Sawyer", "Con Sid Sawyer", "Con William Wilks", "Con Buck Grangerford"], "explanation": "Sally espera a su sobrino Tom y da por hecho que el visitante es él; Huck se adapta a la confusión.", "hint": "La confusión funciona porque Sally espera una visita familiar que no ve desde hace tiempo."}, {"id": "32-2", "chapter": 32, "q": "¿Qué relación existe entre Sally Phelps y Tom?", "options": ["Sally es tía de Tom", "Sally es hija de Tom", "Sally es hermana de Tom", "Sally es una maestra sin parentesco"], "explanation": "La conexión familiar le permite a Huck responder usando lo que ya conoce de la familia de Tom.", "hint": "La confusión funciona porque Sally espera una visita familiar que no ve desde hace tiempo."}, {"id": "32-3", "chapter": 32, "q": "¿Cómo se llama el esposo de Sally?", "options": ["Silas Phelps", "Harvey Wilks", "Saul Grangerford", "Ben Rogers"], "explanation": "Silas Phelps es el dueño de la propiedad donde tienen retenido a Jim.", "hint": "La confusión funciona porque Sally espera una visita familiar que no ve desde hace tiempo."}, {"id": "32-4", "chapter": 32, "q": "¿Qué revela la reacción de Sally al falso relato de un accidente de vapor?", "options": ["El racismo que la lleva a no contar una muerte negra como una tragedia humana", "Su conocimiento secreto de la identidad de Jim", "Su deseo de convertirse en capitana", "Su rechazo a cualquier forma de mentira"], "explanation": "Sally expresa alivio tras enterarse de la supuesta muerte de un hombre negro; la escena denuncia la deshumanización normalizada.", "hint": "La confusión funciona porque Sally espera una visita familiar que no ve desde hace tiempo."}, {"id": "32-5", "chapter": 32, "q": "¿Por qué Huck sale a buscar al verdadero Tom?", "options": ["Teme que llegue y descubra su identidad falsa", "Necesita que le traiga el tesoro", "Quiere enviarlo a Inglaterra", "Silas le ordena arrestarlo"], "explanation": "La llegada de un vapor le hace pensar que Tom puede aparecer y arruinar la suplantación.", "hint": "La confusión funciona porque Sally espera una visita familiar que no ve desde hace tiempo."}]}, {"n": 33, "title": "Tom se suma al plan", "summary": "Tom acepta la confusión de identidades y promete ayudar a Jim. Los chicos ven el castigo cruel al rey y al duque.", "questions": [{"id": "33-1", "chapter": 33, "q": "¿Qué cree Tom al ver a Huck en el camino?", "options": ["Que podría estar viendo un fantasma", "Que se ha convertido en juez", "Que trabaja para el rey de Francia", "Que es William Wilks"], "explanation": "Tom también cree que Huck murió; necesita convencerse de que su amigo está vivo.", "hint": "Todavía no se ha revelado al lector todo lo que Tom sabe sobre Jim."}, {"id": "33-2", "chapter": 33, "q": "¿Qué identidad adopta Tom para sostener la mentira de Huck?", "options": ["Sid Sawyer", "George Jackson", "Harvey Wilks", "Ben Rogers"], "explanation": "Huck sigue siendo Tom para Sally, mientras el verdadero Tom se hace pasar por Sid, su medio hermano.", "hint": "Todavía no se ha revelado al lector todo lo que Tom sabe sobre Jim."}, {"id": "33-3", "chapter": 33, "q": "¿Qué respuesta de Tom sorprende a Huck?", "options": ["Acepta ayudarlo a liberar a Jim", "Se niega a entrar en la casa", "Confiesa que es el rey", "Dice que la viuda murió"], "explanation": "Huck no entiende que un chico de buena familia participe en una acción que su sociedad considera condenable.", "hint": "Todavía no se ha revelado al lector todo lo que Tom sabe sobre Jim."}, {"id": "33-4", "chapter": 33, "q": "¿Qué castigo sufren el rey y el duque?", "options": ["Los cubren de alquitrán y plumas y los pasean sobre un palo", "Los envían como embajadores a Francia", "Los obligan a devolver una corona", "Los nombran actores del pueblo"], "explanation": "La multitud descubre sus estafas y les aplica una humillación violenta, que Huck y Tom no alcanzan a impedir.", "hint": "Todavía no se ha revelado al lector todo lo que Tom sabe sobre Jim."}, {"id": "33-5", "chapter": 33, "q": "¿Qué siente Huck al ver su castigo?", "options": ["Compasión pese a todo lo que hicieron", "Alegría sin ninguna duda", "Envidia de su fama", "Deseo de unirse al linchamiento"], "explanation": "La escena refuerza su rechazo de la crueldad humana, incluso cuando las víctimas son personas que lo perjudicaron.", "hint": "Todavía no se ha revelado al lector todo lo que Tom sabe sobre Jim."}]}, {"n": 34, "title": "Localizar a Jim", "summary": "Tom deduce dónde está Jim. Rechaza el plan sencillo de Huck y propone una fuga elaborada como las de sus libros.", "questions": [{"id": "34-1", "chapter": 34, "q": "¿Qué pista ayuda a Tom a localizar a Jim?", "options": ["Llevan comida humana, incluida sandía, a una cabaña cerrada", "Hay una corona sobre el tejado", "El juez deja un mapa en la puerta", "Un cartel muestra su retrato en la iglesia"], "explanation": "Tom deduce que la comida no es para un perro y relaciona el candado con un prisionero.", "hint": "Fijate en la diferencia entre rescatar con eficacia y fabricar una aventura."}, {"id": "34-2", "chapter": 34, "q": "¿Cómo es el plan inicial de Huck?", "options": ["Sencillo y directo para sacar a Jim", "Una espera de treinta y siete años", "Una falsa guerra entre familias", "Un juicio con los hermanos Wilks"], "explanation": "Huck quiere aprovechar los medios disponibles, mientras Tom considera que esa solución carece de emoción.", "hint": "Fijate en la diferencia entre rescatar con eficacia y fabricar una aventura."}, {"id": "34-3", "chapter": 34, "q": "¿Por qué Tom rechaza el plan sencillo?", "options": ["Porque busca una fuga más espectacular", "Porque sabe que Jim no está allí", "Porque no quiere liberar a Jim jamás", "Porque necesita permiso del doctor"], "explanation": "Tom convierte el rescate en una imitación de aventuras literarias y agrega obstáculos innecesarios.", "hint": "Fijate en la diferencia entre rescatar con eficacia y fabricar una aventura."}, {"id": "34-4", "chapter": 34, "q": "¿Cómo explica Nat las cosas extrañas que le ocurren?", "options": ["Las atribuye a brujas", "Las atribuye al juez", "Las atribuye a los Wilks", "Las atribuye a una inundación"], "explanation": "Tom aprovecha el miedo de Nat a las brujas para desviar sus sospechas.", "hint": "Fijate en la diferencia entre rescatar con eficacia y fabricar una aventura."}, {"id": "34-5", "chapter": 34, "q": "¿Qué le comunican los chicos a Jim en secreto?", "options": ["Que van a ayudarlo a escapar y que no debe reconocerlos en público", "Que Watson lo espera en la isla", "Que el rey volverá a comprarlo", "Que debe confesar el robo del tesoro"], "explanation": "Huck y Tom logran avisarle de su plan sin que Nat comprenda la relación entre ellos.", "hint": "Fijate en la diferencia entre rescatar con eficacia y fabricar una aventura."}]}, {"n": 35, "title": "Inventar dificultades", "summary": "Tom fija reglas absurdas para la fuga: serrar la cama, preparar una escala y excavar con cuchillos.", "questions": [{"id": "35-1", "chapter": 35, "q": "¿Qué lamenta Tom sobre el encierro de Jim?", "options": ["Que es demasiado fácil de resolver y tiene pocos obstáculos", "Que hay un ejército custodiándolo", "Que está rodeado por un foso profundo", "Que Jim se niega a salir"], "explanation": "Tom admite que tendrán que inventar las dificultades que el encierro real no ofrece.", "hint": "Este capítulo trata sobre todo de las reglas y preparativos que Tom exige."}, {"id": "35-2", "chapter": 35, "q": "¿Qué solución sencilla existe para soltar la cadena de la cama?", "options": ["Levantar la cama y deslizar la cadena", "Romper toda la cabaña", "Cortar el árbol más cercano", "Vaciar el río"], "explanation": "Huck advierte una salida fácil; Tom insiste en serrar la pata porque así ocurre en sus modelos de aventuras.", "hint": "Este capítulo trata sobre todo de las reglas y preparativos que Tom exige."}, {"id": "35-3", "chapter": 35, "q": "¿Por qué Tom quiere que Jim tenga una escala de cuerda?", "options": ["Porque aparece en los relatos de fugas que imita", "Porque la cabaña está en una torre", "Porque Silas la exige como prueba", "Porque Jim no puede caminar"], "explanation": "La escala no responde a una necesidad práctica; forma parte del ritual imaginado por Tom.", "hint": "Este capítulo trata sobre todo de las reglas y preparativos que Tom exige."}, {"id": "35-4", "chapter": 35, "q": "¿Qué instrumentos exige Tom para comenzar la excavación?", "options": ["Cuchillos de mesa", "Palas mecánicas", "Remos de vapor", "Hachas de leñador"], "explanation": "Prefiere herramientas inadecuadas por fidelidad a las historias de prisioneros que ha leído.", "hint": "Este capítulo trata sobre todo de las reglas y preparativos que Tom exige."}, {"id": "35-5", "chapter": 35, "q": "¿Qué diferencia resume mejor las posiciones de los chicos?", "options": ["Huck busca resultados y Tom exige seguir modelos de los libros", "Huck quiere fama y Tom solo seguridad", "Ambos rechazan rescatar a Jim", "Ambos aceptan cualquier plan de Silas"], "explanation": "El contraste central es la mirada práctica de Huck frente a la teatralidad de Tom, que retrasa una liberación urgente.", "hint": "Este capítulo trata sobre todo de las reglas y preparativos que Tom exige."}]}, {"n": 36, "title": "Excavar de verdad", "summary": "Los cuchillos no sirven y los chicos pasan a picos y palas, aunque Tom finge que respeta sus reglas. Entran a ver a Jim.", "questions": [{"id": "36-1", "chapter": 36, "q": "¿Qué ocurre cuando intentan excavar con cuchillos?", "options": ["Avanzan muy poco y se lastiman las manos", "Abren el túnel en dos minutos", "Encuentran la herencia de Peter", "Rompen las cadenas de Jim"], "explanation": "La dificultad material demuestra lo poco práctico del método elegido por Tom.", "hint": "A diferencia del capítulo anterior, aquí ponen en práctica la excavación y adaptan los medios."}, {"id": "36-2", "chapter": 36, "q": "¿Qué herramientas terminan usando?", "options": ["Picos y palas", "Solo cucharas de plata", "Ramas y plumas", "Una máquina de vapor"], "explanation": "Tom acepta las herramientas eficaces porque no tienen años disponibles para hacer la excavación como en sus libros.", "hint": "A diferencia del capítulo anterior, aquí ponen en práctica la excavación y adaptan los medios."}, {"id": "36-3", "chapter": 36, "q": "¿Cómo justifica Tom usar herramientas que antes rechazaba?", "options": ["Fingen que los picos son cuchillos", "Pide una autorización judicial", "Dice que Jim ya fue vendido", "Afirma que las fabricó Salomón"], "explanation": "El cambio de nombre conserva la apariencia de seguir las reglas, aunque el procedimiento real sea otro.", "hint": "A diferencia del capítulo anterior, aquí ponen en práctica la excavación y adaptan los medios."}, {"id": "36-4", "chapter": 36, "q": "¿Qué consiguen al avanzar la excavación?", "options": ["Entrar en la cabaña y hablar con Jim", "Llegar hasta la isla de Jackson", "Vaciar el sótano de los Wilks", "Hundir la balsa del duque"], "explanation": "El túnel les permite comunicarse directamente con Jim y explicarle las exigencias del plan.", "hint": "A diferencia del capítulo anterior, aquí ponen en práctica la excavación y adaptan los medios."}, {"id": "36-5", "chapter": 36, "q": "¿Qué explicación preparan para que Nat acepte un pastel extraño?", "options": ["Que servirá para combatir a las brujas", "Que viene firmado por el gobernador", "Que es una medicina del juez", "Que es un regalo del rey de Francia"], "explanation": "Aprovechan sus creencias para facilitar la entrada de objetos de fuga escondidos en un pastel.", "hint": "A diferencia del capítulo anterior, aquí ponen en práctica la excavación y adaptan los medios."}]}, {"n": 37, "title": "Objetos que desaparecen", "summary": "Sally nota que faltan ropa y utensilios. Los chicos manipulan sus cuentas y esconden una escala en un pastel.", "questions": [{"id": "37-1", "chapter": 37, "q": "¿Por qué empiezan a desaparecer objetos de la casa?", "options": ["Los chicos los toman para preparar la fuga", "Los vende Silas al rey", "Los reclama Mary Jane", "Los lleva Pap a la isla"], "explanation": "Camisas, sábanas, cucharas y otros objetos se convierten en materiales para la aventura de Tom.", "hint": "Las molestias domésticas son consecuencias concretas del rescate convertido en juego."}, {"id": "37-2", "chapter": 37, "q": "¿Qué sospecha Silas que explica parte de las desapariciones?", "options": ["Las ratas", "Los hermanos Wilks", "La viuda Douglas", "Una creciente del río"], "explanation": "Silas intenta explicar algunos faltantes por las ratas, aunque esa excusa no sirve para todos los objetos.", "hint": "Las molestias domésticas son consecuencias concretas del rescate convertido en juego."}, {"id": "37-3", "chapter": 37, "q": "¿Cómo confunden los chicos a Sally con las cucharas?", "options": ["Las agregan y retiran mientras ella vuelve a contarlas", "Las cambian todas por cuchillos", "Las envían al juez por correo", "Le dicen que nunca hubo cucharas"], "explanation": "Manipulan el número hasta hacer que Sally desconfíe de sus propias cuentas.", "hint": "Las molestias domésticas son consecuencias concretas del rescate convertido en juego."}, {"id": "37-4", "chapter": 37, "q": "¿Qué preparan para ocultar la escala de cuerda?", "options": ["Un pastel", "Un reloj", "Una botella de tinta", "Un paquete de libros"], "explanation": "La escala hecha con tela se introduce en un pastel para reproducir una convención de las historias de fugas.", "hint": "Las molestias domésticas son consecuencias concretas del rescate convertido en juego."}, {"id": "37-5", "chapter": 37, "q": "¿Qué muestran los problemas para cocinar y esconder la escala?", "options": ["Que las exigencias de Tom añaden trabajo innecesario", "Que Jim no quiere ser libre", "Que Sally conoce toda la verdad", "Que el juez dirige la operación"], "explanation": "Los preparativos consumen tiempo y objetos aunque Jim no necesita esa escala para salir por el túnel.", "hint": "Las molestias domésticas son consecuencias concretas del rescate convertido en juego."}]}, {"n": 38, "title": "Un prisionero de novela", "summary": "Tom exige inscripciones, un escudo y animales de compañía. Jim incluso debe ayudar a trasladar una piedra para su encierro.", "questions": [{"id": "38-1", "chapter": 38, "q": "¿Qué exige Tom que deje Jim como los prisioneros de sus lecturas?", "options": ["Inscripciones y un escudo de armas", "Una factura de la balsa", "Un certificado escolar", "Un plano de Cairo"], "explanation": "Tom inventa un pasado heroico y símbolos que no responden a la vida ni a las necesidades de Jim.", "hint": "Preguntate quién soporta el trabajo y las molestias de las fantasías de Tom."}, {"id": "38-2", "chapter": 38, "q": "¿En qué quieren grabar las inscripciones?", "options": ["En una piedra de afilar grande", "En la puerta del juez", "En una corona de oro", "En la canoa de Pap"], "explanation": "Tom decide que los troncos de la cabaña no son suficientemente propios de una prisión y exige una piedra.", "hint": "Preguntate quién soporta el trabajo y las molestias de las fantasías de Tom."}, {"id": "38-3", "chapter": 38, "q": "¿Qué ironía ocurre al trasladar la piedra?", "options": ["Jim sale para ayudarlos y después vuelve a su encierro", "Sally les regala un carro sin preguntar", "El rey se ofrece a cargarla", "La piedra abre sola el túnel"], "explanation": "El hecho de que Jim pueda salir para colaborar muestra lo artificial de las dificultades que retrasan su fuga.", "hint": "Preguntate quién soporta el trabajo y las molestias de las fantasías de Tom."}, {"id": "38-4", "chapter": 38, "q": "¿Para qué quiere Tom introducir animales en la cabaña?", "options": ["Para imitar la compañía de los presos de sus libros", "Para venderlos en una feria", "Para alimentar a los perros del pueblo", "Para que Jim trabaje en un circo"], "explanation": "Serpientes, ratas y otros animales son accesorios de la fantasía de Tom, aunque Jim no los desea.", "hint": "Preguntate quién soporta el trabajo y las molestias de las fantasías de Tom."}, {"id": "38-5", "chapter": 38, "q": "¿Cómo reacciona Jim ante muchas de estas exigencias?", "options": ["Expresa incomodidad y objeciones prácticas", "Pide que el encierro dure muchos años", "Afirma que todas son indispensables", "Olvida por completo su deseo de libertad"], "explanation": "Jim advierte que las tareas y los animales complican su vida; Tom prioriza su propia idea de aventura.", "hint": "Preguntate quién soporta el trabajo y las molestias de las fantasías de Tom."}]}, {"n": 39, "title": "Animales y cartas amenazantes", "summary": "Los animales causan problemas en la casa y en la cabaña. Tom envía avisos anónimos que provocan una respuesta armada.", "questions": [{"id": "39-1", "chapter": 39, "q": "¿Qué sucede con varias serpientes que capturan los chicos?", "options": ["Escapan por la casa", "Se las lleva el juez a la escuela", "Se convierten en comida para Jim", "Desaparecen en la imprenta"], "explanation": "Una bolsa mal cerrada permite que se dispersen y asusten repetidamente a Sally.", "hint": "Las cartas convierten un plan innecesariamente largo en una situación peligrosa."}, {"id": "39-2", "chapter": 39, "q": "¿Cómo afectan los animales a Jim?", "options": ["Le dificultan descansar y lo molestan continuamente", "Le permiten abrir todas las cerraduras", "Le enseñan el camino a Cairo", "Hacen que Silas lo libere enseguida"], "explanation": "El supuesto adorno aventurero se vuelve sufrimiento para la persona cuya libertad está en juego.", "hint": "Las cartas convierten un plan innecesariamente largo en una situación peligrosa."}, {"id": "39-3", "chapter": 39, "q": "¿Cuánto tiempo llevan preparando la fuga cuando todo está casi listo?", "options": ["Unas tres semanas", "Solo una tarde", "Casi diez años", "Dos inviernos completos"], "explanation": "La preparación se extiende durante semanas por los obstáculos que Tom agrega al rescate.", "hint": "Las cartas convierten un plan innecesariamente largo en una situación peligrosa."}, {"id": "39-4", "chapter": 39, "q": "¿Por qué envía Tom mensajes anónimos?", "options": ["Para avisar de una supuesta banda que intentará liberar al prisionero", "Para informar a Watson de que Jim ya llegó", "Para vender entradas del Royal Nonesuch", "Para que el juez entregue el tesoro"], "explanation": "Tom cree que una gran fuga necesita advertencias y peligro, como las aventuras que imita.", "hint": "Las cartas convierten un plan innecesariamente largo en una situación peligrosa."}, {"id": "39-5", "chapter": 39, "q": "¿Qué consecuencia tienen esas advertencias?", "options": ["La familia reúne hombres armados para vigilar", "Sally deja la casa desierta", "Silas entrega a Jim una canoa", "La viuda viene a buscar a Huck"], "explanation": "Las cartas crean la vigilancia y el riesgo real que antes no existían.", "hint": "Las cartas convierten un plan innecesariamente largo en una situación peligrosa."}]}, {"n": 40, "title": "La fuga y el disparo", "summary": "Los chicos y Jim escapan bajo vigilancia. Tom recibe un disparo y Jim decide quedarse para que lo atiendan.", "questions": [{"id": "40-1", "chapter": 40, "q": "¿Qué lleva Huck escondido y empieza a derretirse mientras Sally lo retiene?", "options": ["Manteca bajo el sombrero", "Una vela dentro del zapato", "Chocolate en un libro", "Cera en una cuchara"], "explanation": "La manteca derretida corre por su cabeza y alarma a Sally, creando otro apuro antes de salir.", "hint": "La elección de Jim al ver a Tom herido es el punto moral decisivo del episodio."}, {"id": "40-2", "chapter": 40, "q": "¿Por qué hay hombres armados esperando cerca de la cabaña?", "options": ["Por los avisos anónimos de Tom", "Por una orden del juez Thatcher", "Porque llegó Pap con soldados", "Porque buscan a los hermanos Wilks"], "explanation": "Los propios mensajes de Tom han provocado la vigilancia que vuelve peligrosa la fuga.", "hint": "La elección de Jim al ver a Tom herido es el punto moral decisivo del episodio."}, {"id": "40-3", "chapter": 40, "q": "¿Qué le ocurre a Tom durante la huida?", "options": ["Recibe un disparo en la pierna", "Se ahoga en el río", "Lo captura el duque", "Pierde un brazo con una sierra"], "explanation": "La aventura inventada tiene una consecuencia real: Tom queda herido y necesita atención médica.", "hint": "La elección de Jim al ver a Tom herido es el punto moral decisivo del episodio."}, {"id": "40-4", "chapter": 40, "q": "¿Qué decide Jim al saber que Tom necesita ayuda?", "options": ["No seguir escapando hasta que lo atienda un médico", "Dejarlo solo para llegar antes a Ohio", "Entregar a Huck al sheriff", "Pedir dinero antes de ayudar"], "explanation": "Jim pone la salud de Tom por encima de su propia oportunidad de huir.", "hint": "La elección de Jim al ver a Tom herido es el punto moral decisivo del episodio."}, {"id": "40-5", "chapter": 40, "q": "¿Qué hace Huck ante la herida de Tom?", "options": ["Sale a buscar un médico", "Regresa a buscar al rey", "Escribe a Mary Jane por la herencia", "Vuelve a la isla de Jackson"], "explanation": "La prioridad pasa a ser conseguir atención médica, mientras Jim permanece con Tom.", "hint": "La elección de Jim al ver a Tom herido es el punto moral decisivo del episodio."}]}, {"n": 41, "title": "El médico y la preocupación de Sally", "summary": "Huck consigue un médico, pero no puede acompañarlo. Regresa a la granja y percibe el sufrimiento de Sally.", "questions": [{"id": "41-1", "chapter": 41, "q": "¿Por qué Huck no acompaña al médico en la canoa?", "options": ["El médico considera que es demasiado pequeña para los dos", "Huck no recuerda dónde está la balsa", "Sally le prohíbe hablar con médicos", "Tom pide que viaje solo Jim"], "explanation": "El médico sale sin Huck, lo que deja al chico sin noticias directas de Tom y Jim.", "hint": "Seguí quién va a atender a Tom y quién vuelve a la casa de los Phelps."}, {"id": "41-2", "chapter": 41, "q": "¿Con quién se cruza Huck antes de volver a la casa?", "options": ["Con Silas Phelps", "Con el rey", "Con Mary Jane", "Con el juez Thatcher"], "explanation": "Silas anda buscándolos y Huck improvisa un relato sobre la noche fuera de casa.", "hint": "Seguí quién va a atender a Tom y quién vuelve a la casa de los Phelps."}, {"id": "41-3", "chapter": 41, "q": "¿Qué identidad sigue teniendo Tom para Sally?", "options": ["Sid", "George", "Harvey", "Buck"], "explanation": "La confusión continúa: Sally cree que Huck es Tom y el herido ausente es Sid.", "hint": "Seguí quién va a atender a Tom y quién vuelve a la casa de los Phelps."}, {"id": "41-4", "chapter": 41, "q": "¿Por qué Sally está especialmente angustiada?", "options": ["Porque el muchacho al que llama Sid no ha regresado", "Porque perdió una herencia en Inglaterra", "Porque desapareció el doctor Robinson", "Porque la balsa bloquea el río"], "explanation": "Sally de   let ok=false;

}catch(e){

}

function renderHome(){session=null;document.body.classList.remove("in-quiz");const p=progress(),pct=Math.round(p.correct/ALL.length*100);app.innerHTML=`<section class="hero"><div><div class="eyebrow">Tu bitácora de lectura</div><h1>Una aventura para<br><em>entender la historia.</em></h1><p>Acompañá a Huck y Jim por el Mississippi. Recordá lo que pasó, conectá las pistas y aprendé con cada respuesta.</p></div>${ART}</section><section class="stats" aria-label="Tu progreso"><div class="stat"><span class="stat-icon">${icon('layers')}</span><b>${ALL.length}</b><span>preguntas para explorar</span></div><div class="stat"><span class="stat-icon">${icon('book')}</span><b>${p.complete}<span style="font-size:16px"> / 43</span></b><span>capítulos recorridos</span></div><div class="stat"><span class="stat-icon">${icon('check-circle')}</span><b>${p.correct}</b><span>últimas respuestas correctas</span></div><div class="stat"><span class="stat-icon">${icon('retry')}</span><b>${wrongIds().length}</b><span>preguntas para repasar</span></div></section><div class="layout"><aside class="side"><div class="sidebox nav"><h2>Elegí cómo navegar</h2><button class="navbtn ${page==='chapters'?'active':''}" data-nav="chapters">${icon('map')} <span>Capítulos</span> <span class="count">43</span></button><button class="navbtn ${page==='exam'?'active':''}" data-nav="exam">${icon('flag')} <span>Examen</span></button><button class="navbtn ${page==='errors'?'active':''}" data-nav="errors">${icon('retry')} <span>Repasar</span> <span class="count">${wrongIds().length}</span></button><button class="navbtn ${page==='marked'?'active':''}" data-nav="marked">${icon('star')} <span>Guardadas</span> <span class="count">${state.marked.length}</span></button></div><div class="sidebox side-note"><div class="tag" style="margin-bottom:10px">Paso a paso</div><b>Aprender también<br>es equivocarse.</b><ol><li>Leé el capítulo del libro.</li><li>Respondé sin mirar.</li><li>Entendé la explicación.</li><li>Volvé sobre las dudas.</li></ol></div><div class="sidebox mini-progress"><h2>Tu recorrido completo</h2><div class="progress" style="margin:13px 0 7px"><div style="width:${pct}%"></div></div><p>${p.correct} de ${ALL.length} preguntas acertadas en el último intento. Respondidas: ${p.attempted}.</p></div></aside><section id="content"></section></div><footer class="footer"><span>Mark Twain · Las aventuras de Huckleberry Finn</span><span>Hecho para estudiar a tu ritmo. El progreso se guarda en este navegador.</span></footer>`;
app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
if(page==='chapters')renderChapters();else if(page==='exam')renderExamSettings();else if(page==='errors'||page==='marked')renderCollection();else renderHelp();}
function resumeHTML(){const s=state.session;if(!s||s.finished||!Array.isArray(s.items)||!s.items.length)return '';return `<div class="resume"><div><strong style="font-size:13px">Tu viaje sigue acá</strong><p>${esc(s.title)} · ${s.index+1} de ${s.items.length}</p></div><button class="btn secondary" id="resumeBtn">Continuar ${icon('arrow')}</button></div>`;}
function bindResume(){const b=document.getElementById('resumeBtn');if(b)b.onclick=()=>{session=state.session;renderQuestion();window.scrollTo({top:0,behavior:'auto'})};}
function chapterCard(c){const tried=c.questions.filter(q=>state.answers[q.id]).length,correct=c.questions.filter(q=>state.answers[q.id]?.correct).length;return `<button class="chapter ${tried===c.questions.length?'completed':''}" data-chapter="${c.n}"><span class="num">${c.n?'CAPÍTULO '+String(c.n).padStart(2,'0'):'CONEXIONES DEL LIBRO'}</span><span class="arrow" aria-hidden="true">${icon('up-right')}</span><h3>${esc(c.title)}</h3><div class="chapter-bottom"><span>${c.questions.length} preguntas · ${tried?correct+'/'+c.questions.length+' acertadas':'Por explorar'}</span><span class="q-dots" aria-hidden="true">${c.questions.map(q=>`<i class="q-dot ${state.answers[q.id]?(state.answers[q.id].correct?'right':'wrong'):''}"></i>`).join('')}</span></div></button>`;}
function renderChapters(){const el=document.getElementById('content');el.innerHTML=`${resumeHTML()}<div class="route-title"><div><div class="tag" style="color:var(--green);margin-bottom:7px">El mapa del viaje</div><h2>43 capítulos para descubrir</h2><p class="sub">Cada respuesta trae su explicación. Sin reloj ni penalizaciones.</p></div></div><div class="tools"><input id="search" type="search" aria-label="Buscar capítulo por número o título" placeholder="Buscar por número o título…"><select id="chapterFilter" aria-label="Filtrar capítulos"><option value="all">Todos los capítulos</option><option value="pending">Con preguntas sin responder</option><option value="errors">Con errores para repasar</option><option value="complete">Completados</option></select></div><div class="chapters" id="chapterGrid"></div><div id="globalCard"></div>`;document.getElementById('search').value=query;document.getElementById('chapterFilter').value=filter;
const update=()=>{let text=query.trim().toLocaleLowerCase();let list=CHAPTERS.filter(c=>c.n).filter(c=>{const search=!text||c.title.toLocaleLowerCase().includes(text)||String(c.n)===text||('capítulo '+c.n).includes(text);let status=true;if(filter==='pending')status=c.questions.some(q=>!state.answers[q.id]);if(filter==='errors')status=c.questions.some(q=>state.answers[q.id]&&!state.answers[q.id].correct);if(filter==='complete')status=c.questions.every(q=>state.answers[q.id]);return search&&status;});document.getElementById('chapterGrid').innerHTML=list.length?list.map(chapterCard).join(''):'<div class="empty" style="grid-column:1/-1"><p>No hay capítulos con ese filtro. Probá otra búsqueda.</p></div>';document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>chapterIntro(Number(b.dataset.chapter)));};
document.getElementById('search').oninput=e=>{query=e.target.value;update()};document.getElementById('chapterFilter').onchange=e=>{filter=e.target.value;update()};document.getElementById('globalCard').innerHTML=`<div class="chapters" style="grid-template-columns:1fr">${chapterCard(CHAPTERS.find(c=>c.n===0))}</div>`;update();bindResume();}
function chapterIntro(n){const c=CHAPTERS.find(c=>c.n===n);const el=document.getElementById('content');el.innerHTML=`<button class="plain" id="backMap">← Volver al mapa</button><div class="settings"><div class="eyebrow">${chapterLabel(n)}</div><h2 style="font-family:Georgia,serif;font-size:32px;line-height:1.2;font-weight:500">${esc(c.title)}</h2><p class="sub">${c.questions.length} preguntas · cuatro opciones · explicación inmediata</p><details class="mode-note"><summary style="cursor:pointer">Antes de empezar: recordar el episodio (contiene pistas)</summary><p>${esc(c.summary)}</p></details><p style="font-size:13px;color:var(--muted)">Intentá responder de memoria. Si te trabás, podés abrir una pista o guardar la pregunta para volver después.</p><button class="btn" id="startChapter">Empezar capítulo ${icon('arrow')}</button></div>`;document.getElementById('backMap').onclick=renderChapters;document.getElementById('startChapter').onclick=()=>start(c.questions,'practice',chapterLabel(n)+' · '+c.title);window.scrollTo({top:0,behavior:'smooth'});}
function renderExamSettings(){const opts=selected=>CHAPTERS.filter(c=>c.n).map(c=>`<option value="${c.n}" ${c.n===selected?'selected':''}>Capítulo ${c.n}</option>`).join('');document.getElementById('content').innerHTML=`${resumeHTML()}<div class="route-title"><div><div class="tag" style="color:var(--green);margin-bottom:7px">Conectá lo que aprendiste</div><h2>Un desafío a tu medida</h2><p class="sub">Preguntas mezcladas. Las explicaciones aparecen al terminar.</p></div></div><div class="settings"><h3>Prepará tu examen</h3><p class="sub">Elegí los capítulos que ya leíste para evitar adelantarte a la historia.</p><label for="fromChapter">Desde / hasta</label><div class="ranges"><select id="fromChapter" aria-label="Desde el capítulo">${opts(Number(state.settings.from))}</select><span>→</span><select id="toChapter" aria-label="Hasta el capítulo">${opts(Number(state.settings.to))}</select></div><label for="examCount">Cantidad de preguntas</label><select id="examCount"><option value="10">10 · Práctica breve</option><option value="20">20 · Desafío intermedio</option><option value="40">40 · Repaso amplio</option><option value="all">Todas las del rango elegido</option></select><label class="check"><input type="checkbox" id="includeGeneral">Incluir repaso general del libro completo (con desenlace)</label><div class="mode-note">Una sola respuesta por pregunta. Sin tiempo límite. El resultado cuenta este intento; también actualiza tus preguntas pendientes de repaso. Las preguntas guardadas siguen disponibles.</div><p id="rangeError" role="alert" style="font-size:12px;color:var(--red)"></p><button class="btn" id="startExam">Empezar examen ${icon('arrow')}</button></div>`;document.getElementById('examCount').value=state.settings.count;document.getElementById('startExam').onclick=()=>{const from=Number(document.getElementById('fromChapter').value),to=Number(document.getElementById('toChapter').value),count=document.getElementById('examCount').value;if(from>to){document.getElementById('rangeError').textContent='El capítulo inicial debe ser anterior o igual al final.';return;}state.settings={...state.settings,from,to,count};save();let pool=ALL.filter(q=>q.chapter>=from&&q.chapter<=to||q.chapter===0&&document.getElementById('includeGeneral').checked);pool=shuffle(pool).slice(0,count==='all'?pool.length:Math.min(Number(count),pool.length));start(pool,'exam',`Examen · capítulos ${from}–${to}`)};bindResume();}
function renderCollection(){const errors=page==='errors',ids=errors?wrongIds():state.marked;const title=errors?'Una nueva oportunidad':'Tus preguntas guardadas';document.getElementById('content').innerHTML=`<div class="route-title"><div><div class="tag" style="color:var(--green);margin-bottom:7px">${errors?'Volver para aprender':'Tu selección personal'}</div><h2>${title}</h2><p class="sub">${errors?'Al acertar, la pregunta sale de esta lista.':'Guardá las preguntas con ☆ mientras practicás.'}</p></div></div>${ids.length?`<div class="settings"><h3>${ids.length} preguntas te esperan</h3><p class="sub">Se mezclan las preguntas y sus opciones. Vas a recibir explicaciones en cada paso.</p><button class="btn" id="startCollection">${errors?'Repasar mis errores':'Practicar las guardadas'} →</button></div><div class="review-list">${ids.map(id=>{const q=BY_ID.get(id);return `<div class="review-item"><span class="tag">${chapterLabel(q.chapter)}</span><h3>${esc(q.q)}</h3></div>`}).join('')}</div>`:`<div class="empty"><div style="font-size:38px" aria-hidden="true">${errors?'✧':'☆'}</div><h3>${errors?'Todo despejado por acá':'Tu bitácora empieza acá'}</h3><p>${errors?'Cuando te equivoques, la pregunta aparecerá aquí para que puedas practicarla otra vez.':'Marcá las preguntas que quieras revisar, aunque las hayas respondido bien.'}</p><button class="btn secondary" id="goChapters">Explorar capítulos →</button></div>`}`;if(ids.length)document.getElementById('startCollection').onclick=()=>start(shuffle(ids.map(id=>BY_ID.get(id))),'practice',errors?'Repaso de errores':'Preguntas guardadas');else document.getElementById('goChapters').onclick=()=>nav('chapters');}
function renderHelp(){document.getElementById('content').innerHTML=`<div class="route-title"><h2>Una buena forma de estudiar</h2></div><div class="settings help-content"><h3>Primero el libro, después el desafío</h3><p>Esta bitácora sigue los 43 capítulos de la novela completa. Si tu libro escolar está abreviado, buscá los episodios por el título y por lo que sucede, además del número.</p><ol><li><b>Practicá por capítulo.</b> Respondé sin mirar el libro y leé la explicación, incluso si acertaste.</li><li><b>Volvé a la escena.</b> Si una explicación te sorprende, buscá el pasaje y comprobá por qué la otra opción no encaja.</li><li><b>Usá las guardadas.</b> Marcá con ☆ las preguntas que te generan dudas para revisarlas después.</li><li><b>Hacé un examen mezclado.</b> Elegí solo los capítulos leídos. Las soluciones aparecen al finalizar.</li><li><b>Explicalo con tus palabras.</b> Además de acertar, contá qué ocurrió, por qué ocurrió y qué muestra sobre los personajes.</li></ol><h3>Cómo se guarda el avance</h3><p>Se conserva en este navegador y dispositivo. Cerrar el archivo no borra el avance si el navegador permite almacenamiento local. El modo privado, borrar datos o mover/renombrar el HTML puede afectar la recuperación. No hay cuentas ni envío de respuestas.</p><h3>Qué significan los números</h3><p>Un capítulo está recorrido cuando respondiste todas sus preguntas. Las respuestas acertadas y los errores reflejan tu <b>último intento</b> de cada pregunta. El examen muestra la nota de esa sesión. Volver a contestar no agrega preguntas nuevas a tu progreso.</p><h3>Contenido y fuente</h3><p>Preguntas de hechos, personajes, secuencias y comprensión literaria, con una única respuesta válida. Se toma como base la <a href="https://www.gutenberg.org/files/76/76-h/76-h.htm" target="_blank" rel="noopener">novela completa en Project Gutenberg</a>. Los títulos de cada bloque son propios de esta guía. La numeración 43 corresponde al capítulo final. Las traducciones pueden variar en nombres y palabras.</p><p>El libro muestra violencia, esclavitud y racismo. Las explicaciones señalan esas injusticias y distinguen los prejuicios de un personaje de la mirada crítica que puede construir el lector.</p><h3>Empezar de cero</h3><h3>Respaldo y transferencia de progreso</h3>
<p>Podés descargar una copia de tu avance para no perderlo nunca, o importarla en otro celular o computadora.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px">
  <button class="btn secondary" id="exportBtn">${icon('arrow')} Descargar copia de progreso (.json)</button>
  <button class="btn secondary" id="importBtn">${icon('retry')} Restaurar progreso desde archivo</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</div>
<h3>Empezar de cero</h3>
<p>Esta acción borra los resultados, la sesión y las preguntas guardadas de este archivo en este navegador.</p>
<button class="btn secondary" id="resetBtn">Borrar mi progreso</button><div id="resetConfirm" class="hidden mode-note"><p>¿Querés borrar todo el avance? No se puede recuperar.</p><button class="btn" id="confirmReset">Sí, borrar</button> <button class="btn secondary" id="cancelReset">Cancelar</button></div></div>`;const expB=document.getElementById('exportBtn');if(expB)expB.onclick=()=>{const dataStr='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(state,null,2));const dl=document.createElement('a');dl.setAttribute('href',dataStr);dl.setAttribute('download','huckleberry_finn_progreso.json');dl.click();toast('Copia de progreso descargada correctamente.');};
const impB=document.getElementById('importBtn'),impF=document.getElementById('importFile');if(impB&&impF){impB.onclick=()=>impF.click();impF.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=evt=>{try{const d=JSON.parse(evt.target.result);if(d&&typeof d==='object'){state={...fresh(),...d};state.answers=Object.fromEntries(Object.entries(state.answers||{}).filter(([k,v])=>BY_ID.has(k)&&v&&typeof v.correct==='boolean'));state.marked=(state.marked||[]).filter(id=>BY_ID.has(id));save();toast('¡Progreso restaurado con éxito!');nav('chapters');}else{toast('Archivo no válido.');}}catch(err){toast('Error al leer el archivo.');}};r.readAsText(f);};}
document.getElementById('resetBtn').onclick=()=>document.getElementById('resetConfirm').classList.remove('hidden');document.getElementById('cancelReset').onclick=()=>document.getElementById('resetConfirm').classList.add('hidden');document.getElementById('confirmReset').onclick=()=>{state=fresh();save();toast('El progreso se reinició. Nuevo viaje, nueva oportunidad.');nav('chapters')};}
function start(qs,mode,title){if(!qs.length){toast('No hay preguntas en esa selección.');return;}session={title,mode,index:0,items:qs.map(q=>({id:q.id,order:shuffle([0,1,2,3]),selected:null,hintOpen:false})),finished:false};state.session=session;save();renderQuestion();window.scrollTo({top:0,behavior:'auto'});}
function record(q,selected){const previous=state.answers[q.id];state.answers[q.id]={correct:selected===0,selected,attempts:(previous?.attempts||0)+1};}
function renderQuestion(){if(!session)return;document.body.classList.add("in-quiz");if(session.index>=session.items.length){finish();return;}const item=session.items[session.index],q=BY_ID.get(item.id),answered=item.selected!==null,reveal=answered&&session.mode!=='exam',correct=item.selected===0,idx=session.index;
app.innerHTML=`<section class="quiz-shell"><div class="quiz-top"><button class="plain" id="pauseBtn">${icon('pause')} Pausar</button><p>${icon(session.mode==='exam'?'flag':'book')} ${session.mode==='exam'?'Examen':'Práctica'} · <b>${idx+1} / ${session.items.length}</b></p></div><div class="progress" role="progressbar" aria-label="Avance de la sesión" aria-valuemin="0" aria-valuemax="${session.items.length}" aria-valuenow="${idx}"><div style="width:${idx/session.items.length*100}%"></div></div><article class="quiz-card"><div class="question-meta"><span class="pill">${chapterLabel(q.chapter)}</span><button class="bookmark ${state.marked.includes(q.id)?'on':''}" id="markBtn" aria-pressed="${state.marked.includes(q.id)}">${icon('star')} ${state.marked.includes(q.id)?'Guardada':'Guardar'}</button></div><p class="chapter-name">${esc(chapterOf(q).title)}</p><h1 class="question" id="questionTitle" tabindex="-1">${esc(q.q)}</h1><div class="options" role="group" aria-labelledby="questionTitle">${item.order.map((option,pos)=>{const right=reveal&&option===0,wrong=reveal&&option===item.selected&&!correct;return `<button class="option ${right?'right':wrong?'wrong':answered&&session.mode==='exam'&&option===item.selected?'chosen':''}" data-option="${option}" ${answered?'disabled':''}><span class="letter" aria-hidden="true">${right?'✓':wrong?'×':String.fromCharCode(65+pos)}</span><span>${esc(q.options[option])}</span>${right?'<span class="verdict" aria-label="Respuesta correcta">✓</span>':wrong?'<span class="verdict" aria-label="Tu respuesta, incorrecta">×</span>':''}</button>`}).join('')}</div>${item.hintOpen&&!reveal?`<div class="hint" role="status"><b>Una pista:</b> ${esc(q.hint)}</div>`:''}${reveal?`<div class="feedback ${correct?'':'error'}" role="status"><h3>${icon(correct?'check-circle':'bulb')}${correct?['¡Bien visto!','¡Seguís avanzando!','¡Buena lectura!'][idx%3]:['Vamos a entenderlo.','Esta merece otra mirada.','Una pista para el próximo intento.'][idx%3]}</h3>${!correct?`<p class="answerline"><b>Tu respuesta:</b> ${esc(q.options[item.selected])}</p><p class="answerline"><b>La respuesta correcta:</b> ${esc(q.options[0])}</p>`:''}<p>${esc(q.explanation)}</p>${!correct?'<p><b>Ya quedó en tu lista de errores para repasar.</b></p>':''}</div>`:answered?'<div class="mode-note" role="status">Respuesta registrada. Vas a ver la explicación al terminar el examen.</div>':''}<div class="quiz-actions"><button class="btn secondary" id="hintBtn" ${session.mode==='exam'||answered?'disabled':''}>${session.mode==='exam'?'Pistas solo en práctica':item.hintOpen?'Ocultar pista':'¿Una pista?'}</button><button class="btn" id="nextBtn" ${answered?'':'disabled'}>${idx===session.items.length-1?'Ver resultado':'Siguiente'} ${icon('arrow')}</button></div></article><p class="shortcuts">Podés usar 1, 2, 3 o 4 para responder y Enter para seguir. No hay prisa.</p></section>`;
document.getElementById('pauseBtn').onclick=()=>{state.session=session;save();session=null;nav('chapters');toast(storageOK?'Sesión pausada. Podés continuar cuando quieras.':'Sesión pausada mientras este archivo siga abierto.');};document.getElementById('markBtn').onclick=()=>{if(state.marked.includes(q.id))state.marked=state.marked.filter(id=>id!==q.id);else state.marked.push(q.id);save();const b=document.getElementById('markBtn'),yes=state.marked.includes(q.id);b.classList.toggle('on',yes);b.setAttribute('aria-pressed',String(yes));b.innerHTML=icon('star')+(yes?' Guardada':' Guardar');};
document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.option)));
document.getElementById('hintBtn').onclick=()=>{item.hintOpen=!item.hintOpen;save();renderQuestion()};document.getElementById('nextBtn').onclick=next;document.getElementById('questionTitle').focus({preventScroll:true});}
function answer(option){
  if(!session||session.finished)return;
  const item=session.items[session.index];
  if(item.selected!==null||![0,1,2,3].includes(option))return;
  item.selected=option;
  const q=BY_ID.get(item.id);
  if(session.mode!=='exam')record(q,option);
  save();
  renderQuestion();
  if(option===0&&session.mode!=='exam')celebration();
  if(session.mode!=='exam'){
    setTimeout(()=>{
      const fb=document.querySelector('.feedback');
      if(fb){
        fb.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
    },100);
  }
}
function next(){if(!session||session.finished||session.items[session.index].selected===null)return;session.index++;save();if(session.index===session.items.length)finish();else renderQuestion();window.scrollTo({top:0,behavior:'auto'});}
function finish(){if(!session)return;document.body.classList.remove("in-quiz");if(!session.finished){if(session.mode==='exam')session.items.forEach(item=>record(BY_ID.get(item.id),item.selected));session.finished=true;const right=session.items.filter(x=>x.selected===0).length;state.best=Math.max(state.best,Math.round(right/session.items.length*100));save();if(right/session.items.length>=.7)celebration(true);}reviewFilter='all';renderResult();}
function renderResult(){const right=session.items.filter(x=>x.selected===0).length,total=session.items.length,wrong=total-right,pct=Math.round(right/total*100);app.innerHTML=`<section class="quiz-shell"><div class="result-card"><div class="result-orb"><span>${icon('trophy')}</span>${pct}%</div><span class="result-tag">${esc(session.title)}</span><h1>${pct>=90?'¡Una gran travesía!':pct>=60?'¡El viaje va tomando forma!':'Cada intento te enseña algo.'}</h1><p class="sub">${wrong?'Revisá las explicaciones y volvé a los episodios que te generaron dudas.':'Resolviste todas las preguntas de esta sesión. Probá contar los hechos con tus palabras.'}</p><div class="result-split"><div><b>${right}</b><span>aciertos</span></div><div><b>${wrong}</b><span>para revisar</span></div><div><b>${total}</b><span>respondidas</span></div></div><div class="result-actions">${wrong?'<button class="btn" id="retryErrors">Repasar estos errores ↻</button>':''}<button class="btn secondary" id="repeatSession">Repetir sesión</button><button class="btn secondary" id="resultHome">Volver al mapa →</button></div></div><div class="route-title" style="margin-top:30px"><div><h2>Lo que te llevás del viaje</h2><p class="sub">Leé el porqué de cada respuesta.</p></div><button class="plain" id="printBtn">${icon('print')} Imprimir</button></div><div class="filter-buttons"><button data-review="all" class="active">Todas (${total})</button><button data-review="errors">Solo errores (${wrong})</button></div><div class="review-list" id="resultReview"></div></section>`;
document.getElementById('resultHome').onclick=()=>nav('chapters');document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('repeatSession').onclick=()=>{const qs=session.items.map(i=>BY_ID.get(i.id)),mode=session.mode,title=session.title;start(qs,mode,title)};if(wrong)document.getElementById('retryErrors').onclick=()=>{const qs=session.items.filter(i=>i.selected!==0).map(i=>BY_ID.get(i.id));start(shuffle(qs),'practice','Repaso de este intento')};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.review;document.querySelectorAll('[data-review]').forEach(x=>x.classList.toggle('active',x===b));renderReview()});renderReview();}
function renderReview(){const items=session.items.filter(i=>reviewFilter!=='errors'||i.selected!==0);document.getElementById('resultReview').innerHTML=items.length?items.map(item=>{const q=BY_ID.get(item.id),ok=item.selected===0;return `<article class="review-item"><span class="tag" style="color:${ok?'var(--green)':'var(--red)'}">${ok?'✓ Acierto':'↻ Para repasar'} · ${chapterLabel(q.chapter)}</span><h3>${esc(q.q)}</h3>${!ok?`<p class="wrong-text"><b>Elegiste:</b> ${esc(q.options[item.selected])}</p>`:''}<p class="correct-text">${esc(q.options[0])}</p><p>${esc(q.explanation)}</p></article>`}).join(''):'<div class="empty"><p>No hubo errores en esta sesión.</p></div>';}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||!session||session.finished||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const item=session.items[session.index];if(!item)return;if(/^[1-4]$/.test(e.key)&&item.selected===null){e.preventDefault();answer(item.order[Number(e.key)-1]);}else if(e.key==='Enter'&&item.selected!==null&&e.target.tagName!=='BUTTON'){e.preventDefault();next();}});
renderHome();
</script>
</body></html>
