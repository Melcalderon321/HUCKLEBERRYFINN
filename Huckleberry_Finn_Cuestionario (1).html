<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143e3a">
<title>Río de aventuras · Huckleberry Finn</title>
<style>
:root {
  --ink: #0f2922;
  --ink-pure: #091a15;
  --muted: #536c64;
  --muted-light: #7c9890;
  --paper: #f4f7f4;
  --card: #ffffff;
  --card-subtle: #f8faf8;
  --line: #e1e7e2;
  --line-light: #edf2ee;
  --green: #0d7a5f;
  --green-dark: #085542;
  --green-glow: rgba(13, 122, 95, 0.15);
  --lime: #10b981;
  --accent: #10b981;
  --gold: #f59e0b;
  --gold-soft: #fef3c7;
  --gold-border: #fde68a;
  --coral: #f97316;
  --red: #ef4444;
  --red-soft: #fee2e2;
  --red-border: #fca5a5;
  --shadow-sm: 0 2px 5px rgba(15, 41, 34, 0.04), 0 1px 2px rgba(15, 41, 34, 0.02);
  --shadow: 0 10px 25px -3px rgba(15, 41, 34, 0.07), 0 4px 10px -2px rgba(15, 41, 34, 0.03);
  --shadow-lg: 0 20px 35px -5px rgba(15, 41, 34, 0.1), 0 8px 16px -4px rgba(15, 41, 34, 0.04);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-pill: 9999px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(circle at 12% 10%, rgba(16, 185, 129, 0.07) 0%, transparent 42%),
              radial-gradient(circle at 88% 60%, rgba(245, 158, 11, 0.05) 0%, transparent 45%),
              #f4f7f4;
  background-attachment: fixed;
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { cursor: pointer; color: inherit; }
button:disabled { cursor: default; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--green); text-decoration: none; }
a:hover { text-decoration: underline; }

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid #0d7a5f;
  outline-offset: 3px;
}

.wrap {
  max-width: 1240px;
  margin: auto;
  padding: 0 32px;
}

/* Header */
.top {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(244, 247, 244, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(225, 231, 226, 0.9);
  transition: box-shadow 0.2s ease;
}
.top .wrap {
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}
.brand {
  border: 0;
  background: none;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  padding: 0;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ink-pure);
  transition: transform 0.2s ease;
}
.brand:hover {
  transform: translateY(-1px);
}
.brand-icon {
  background: linear-gradient(135deg, #0f2922 0%, #155e4b 100%);
  color: #34d399;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 24px;
  box-shadow: 0 4px 14px rgba(13, 122, 95, 0.25);
  flex-shrink: 0;
}
.brand-icon .icon { width: 26px; height: 26px; stroke-width: 1.6; }
.brand span { font-size: 17px; font-weight: 800; }
.brand small {
  display: block;
  font-size: 9.5px;
  letter-spacing: 1.6px;
  font-weight: 700;
  color: var(--muted);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: var(--radius-pill);
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 650;
  color: var(--muted);
}
.dot {
  height: 8px;
  width: 8px;
  background: #10b981;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
}
.plain {
  background: none;
  border: 0;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
}
.plain:hover {
  background: #e9f0ea;
  color: var(--ink);
}
.help-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  background: #ffffff;
  border: 1.5px solid var(--line);
  box-shadow: var(--shadow-sm);
  border-radius: 12px;
  padding: 9px 15px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
.help-button:hover {
  border-color: #0d7a5f;
  background: #f8faf8;
  color: #0d7a5f;
}

/* Hero */
.hero {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 48px;
  padding: 52px 0 36px;
  align-items: center;
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--green);
}
.eyebrow:before {
  content: "";
  display: block;
  width: 24px;
  height: 2.5px;
  border-radius: 2px;
  background: currentColor;
}
h1 {
  font-size: clamp(38px, 4.5vw, 60px);
  line-height: 1.1;
  font-weight: 500;
  letter-spacing: -1.6px;
  margin: 18px 0;
  color: var(--ink-pure);
}
h1 em {
  font-style: normal;
  background: linear-gradient(135deg, #0d7a5f 0%, #10b981 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p {
  max-width: 480px;
  color: var(--muted);
  font-size: 15.5px;
  line-height: 1.7;
  margin: 0;
}
.hero-art {
  height: 320px;
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  background: #cfe2d5;
  box-shadow: var(--shadow-lg);
  border: 1px solid rgba(225, 231, 226, 0.7);
}
.hero-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  object-position: 50% 55%;
}
.hero-art::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: inherit;
  pointer-events: none;
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  margin: 12px 0 32px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.stat {
  padding: 22px 26px 22px 64px;
  position: relative;
  border-right: 1.5px solid var(--line);
  transition: background 0.2s ease, transform 0.2s ease;
}
.stat:last-child { border-right: 0; }
.stat:hover { background: #fafcfa; }
.stat .stat-icon {
  position: absolute;
  top: 22px;
  left: 20px;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: #edf7f2;
  color: var(--green);
}
.stat .stat-icon .icon { width: 22px; height: 22px; }
.stat b {
  display: block;
  font-size: 29px;
  line-height: 1.2;
  letter-spacing: -1.2px;
  color: var(--ink-pure);
  font-weight: 800;
}
.stat>span:last-child {
  font-size: 12px;
  color: var(--muted);
  display: block;
  line-height: 1.4;
  margin-top: 3px;
}

/* Layout */
.layout {
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  gap: 32px;
  padding-bottom: 40px;
}
.side {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.sidebox {
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 22px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.sidebox h2 {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.2px;
  margin: 0 0 12px;
  color: var(--ink-pure);
}
.sidebox p {
  font-size: 13px;
  color: var(--muted);
  margin: 8px 0;
  line-height: 1.6;
}
.navbtn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  margin: 5px 0;
  border: 1px solid transparent;
  border-radius: 12px;
  text-align: left;
  background: none;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.navbtn .icon { width: 20px; height: 20px; flex-shrink: 0; }
.navbtn:not(.active):hover {
  background: #edf3ee;
  color: var(--ink-pure);
  transform: translateX(3px);
}
.navbtn.active {
  background: linear-gradient(135deg, #0f2922 0%, #155e4b 100%);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(13, 122, 95, 0.25);
}
.navbtn .count {
  margin-left: auto;
  font-size: 11px;
  min-width: 22px;
  padding: 2px 7px;
  border-radius: 10px;
  background: #edf3ee;
  color: var(--muted);
  text-align: center;
  font-weight: 700;
}
.navbtn.active .count {
  background: rgba(255, 255, 255, 0.25);
  color: #ffffff;
}
.side-note {
  background: linear-gradient(135deg, #eef7f2 0%, #f7fbf8 100%);
  border: 1.5px solid #cce5d7;
}
.side-note b {
  font-size: 21px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--ink-pure);
  display: block;
  margin-bottom: 8px;
}
.side-note ol {
  font-size: 13px;
  padding-left: 18px;
  color: var(--muted);
  margin-bottom: 0;
  line-height: 1.65;
}
.side-note li { margin-bottom: 6px; }

/* Route title */
.route-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}
.route-title h2 {
  font-size: 32px;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -0.9px;
  margin: 0;
  color: var(--ink-pure);
}
.sub {
  font-size: 13.5px;
  color: var(--muted);
  margin: 6px 0 0;
  line-height: 1.6;
}
.tag {
  font-size: 10.5px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  font-weight: 800;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  background: linear-gradient(135deg, #0f2922 0%, #155e4b 100%);
  border: 1px solid transparent;
  color: #ffffff;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 700;
  text-decoration: none;
  min-height: 48px;
  box-shadow: 0 4px 14px rgba(15, 41, 34, 0.16);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn .icon { width: 18px; height: 18px; }
.btn:hover:not(:disabled) {
  background: linear-gradient(135deg, #155e4b 0%, #0d7a5f 100%);
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(13, 122, 95, 0.28);
}
.btn:active:not(:disabled) {
  transform: scale(0.98);
}
.btn.secondary {
  background: #ffffff;
  color: var(--ink);
  border: 1.5px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.btn.secondary:hover:not(:disabled) {
  background: #f8faf8;
  border-color: #c7d2ca;
  box-shadow: var(--shadow);
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
  box-shadow: none;
  transform: none;
}

/* Resume Box */
.resume {
  border: 1.5px solid #a7f3d0;
  background: linear-gradient(135deg, #ecfdf5 0%, #f7fbf8 100%);
  padding: 16px 20px;
  border-radius: 18px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: var(--shadow-sm);
}
.resume p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.resume strong { font-size: 14px; color: var(--ink-pure); }

/* Tools */
.tools {
  display: flex;
  gap: 12px;
  margin: 20px 0;
}
input[type=search] {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  min-width: 0;
  flex: 1;
  font-size: 14px;
  width: 100%;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type=search]:focus {
  border-color: #0d7a5f;
  box-shadow: 0 0 0 4px rgba(13, 122, 95, 0.12);
  outline: none;
}
select {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  color: var(--ink);
  font-size: 14px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s;
}
select:focus {
  border-color: #0d7a5f;
  box-shadow: 0 0 0 4px rgba(13, 122, 95, 0.12);
  outline: none;
}

/* Chapters */
.chapters {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.chapter {
  padding: 22px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  text-align: left;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
              border-color 0.25s ease,
              box-shadow 0.25s ease;
  position: relative;
  box-shadow: var(--shadow-sm);
  min-height: 140px;
}
.chapter:hover {
  transform: translateY(-4px);
  border-color: #0d7a5f;
  box-shadow: 0 14px 28px -4px rgba(13, 122, 95, 0.14), 0 4px 10px rgba(0, 0, 0, 0.02);
}
.chapter.completed {
  border-color: #a7f3d0;
  background: linear-gradient(180deg, #ffffff 0%, #f6fdfa 100%);
}
.chapter .num {
  font-size: 10.5px;
  letter-spacing: 1.5px;
  color: var(--muted);
  font-weight: 800;
  text-transform: uppercase;
}
.chapter h3 {
  font-size: 16px;
  line-height: 1.45;
  margin: 10px 0 18px;
  padding-right: 24px;
  letter-spacing: -0.2px;
  color: var(--ink-pure);
  font-weight: 700;
}
.chapter-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}
.q-dots { display: flex; gap: 5px; }
.q-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #dfe5e0;
}
.q-dot.right {
  background: #10b981;
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
}
.q-dot.wrong {
  background: #f87171;
}
.arrow {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: #f0f5f1;
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: all 0.2s ease;
}
.chapter:hover .arrow {
  background: #0d7a5f;
  color: #ffffff;
  transform: translate(2px, -2px);
}
.arrow .icon { width: 18px; height: 18px; }

/* Settings */
.settings {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 24px;
  padding: 34px;
  box-shadow: var(--shadow);
}
.settings h3 {
  margin: 0 0 10px;
  font-size: 22px;
  letter-spacing: -0.4px;
  color: var(--ink-pure);
}
.settings label {
  display: block;
  font-size: 13px;
  font-weight: 750;
  margin: 22px 0 10px;
  color: var(--ink);
}
.ranges {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ranges select { flex: 1; min-width: 0; }
.settings .btn { margin-top: 24px; }
.mode-note {
  padding: 16px 18px;
  border-radius: 14px;
  background: #f0f5f1;
  font-size: 13px;
  color: var(--muted);
  margin-top: 20px;
  line-height: 1.7;
}

/* Quiz view */
.quiz-shell {
  max-width: 860px;
  margin: 30px auto 60px;
}
.quiz-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.quiz-top p {
  font-size: 13px;
  margin: 0;
  font-weight: 600;
  color: var(--muted);
}
.progress {
  height: 8px;
  background: #e2e8e3;
  border-radius: 9999px;
  overflow: hidden;
  margin: 18px 0 28px;
}
.progress>div {
  height: 100%;
  border-radius: 9999px;
  background: linear-gradient(90deg, #0d7a5f 0%, #10b981 100%);
  transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
}
.quiz-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 24px;
  padding: 38px 34px;
  box-shadow: var(--shadow-lg);
  animation: enter 0.35s ease;
}
.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.question-meta .pill { font-size: 11px; padding: 6px 13px; }
.bookmark {
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #ffffff;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  transition: all 0.2s ease;
}
.bookmark:hover { border-color: #0d7a5f; color: var(--ink); }
.bookmark.on {
  background: var(--gold-soft);
  border-color: var(--gold-border);
  color: #b45309;
}
.bookmark.on .icon { fill: #f59e0b; }
.chapter-name {
  font-size: 13px;
  color: var(--muted);
  margin: 22px 0 10px;
  font-weight: 600;
}
.question {
  font-size: clamp(22px, 2.6vw, 29px);
  font-weight: 700;
  letter-spacing: -0.65px;
  line-height: 1.35;
  margin: 0 0 26px;
  color: var(--ink-pure);
}
.options {
  display: grid;
  gap: 12px;
}
.option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  text-align: left;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  background: #ffffff;
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(15, 41, 34, 0.02);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.option:not(:disabled):hover {
  border-color: #0d7a5f;
  background: #f3f9f6;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(13, 122, 95, 0.08);
}
.option:not(:disabled):active {
  transform: scale(0.99);
}
.option .letter {
  display: grid;
  place-items: center;
  min-width: 32px;
  height: 32px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-size: 12px;
  font-weight: 800;
  background: #f8faf8;
  color: var(--muted);
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.option.right {
  border-color: #10b981;
  background: #ecfdf5;
  box-shadow: 0 4px 16px rgba(16, 185, 129, 0.15);
}
.option.right .letter {
  background: #059669;
  color: #ffffff;
  border-color: #059669;
}
.option.wrong {
  border-color: #ef4444;
  background: #fef2f2;
  box-shadow: 0 4px 16px rgba(239, 68, 68, 0.12);
}
.option.wrong .letter {
  background: #dc2626;
  color: #ffffff;
  border-color: #dc2626;
}
.option.chosen {
  border-color: #0d7a5f;
  background: #ecfdf5;
}
.option .verdict {
  margin-left: auto;
  font-size: 20px;
  font-weight: 900;
}
.quiz-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 28px;
}
.hint {
  background: var(--gold-soft);
  border: 1.5px solid var(--gold-border);
  border-radius: 14px;
  padding: 16px 18px;
  font-size: 14px;
  line-height: 1.7;
  color: #92400e;
  margin-top: 18px;
}
.feedback {
  margin-top: 24px;
  padding: 22px 24px;
  border-radius: 18px;
  background: #ecfdf5;
  border: 1.5px solid #a7f3d0;
  animation: enter 0.35s ease;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.08);
}
.feedback.error {
  background: #fef2f2;
  border-color: #fecaca;
  box-shadow: 0 4px 14px rgba(239, 68, 68, 0.08);
}
.feedback h3 {
  margin: 0 0 10px;
  font-size: 19px;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-pure);
}
.feedback p { margin: 8px 0 0; font-size: 14px; line-height: 1.75; }
.feedback .answerline { font-size: 13.5px; }
.shortcuts { font-size: 11px; color: var(--muted); text-align: center; margin: 16px 0; }

/* Review items */
.review-list { display: grid; gap: 14px; margin-top: 24px; }
.review-item {
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.review-item h3 { font-size: 15.5px; line-height: 1.45; margin: 10px 0; font-weight: 700; color: var(--ink-pure); }
.review-item p { font-size: 13.5px; margin: 8px 0; line-height: 1.7; }
.review-item .correct-text { color: #059669; font-weight: 700; }
.review-item .wrong-text { color: #dc2626; }

/* Result card */
.result-card {
  text-align: center;
  padding: 42px 34px;
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--shadow-lg);
}
.result-card h1 { font-size: 38px; letter-spacing: -1.2px; margin: 16px 0; }
.result-orb {
  height: 136px;
  width: 136px;
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #ffffff;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 36px;
  letter-spacing: -1.5px;
  font-weight: 800;
  animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 12px 30px rgba(16, 185, 129, 0.35);
}
.result-orb .icon { width: 28px; height: 28px; }
.result-tag {
  display: inline-block;
  background: #edf7f2;
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
}
.result-split {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 26px 0;
}
.result-split > div {
  flex: 1;
  max-width: 130px;
  padding: 16px 12px;
  background: #f8faf8;
  border: 1.5px solid var(--line);
  border-radius: 16px;
}
.result-split b { display: block; font-size: 26px; color: var(--ink-pure); font-weight: 800; }
.result-split span { font-size: 12px; color: var(--muted); }
.result-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

/* Empty */
.empty {
  padding: 42px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  text-align: center;
}
.empty h3 { font-size: 26px; font-weight: 500; margin: 10px; color: var(--ink-pure); }
.empty p { font-size: 14px; color: var(--muted); }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 41, 34, 0.95);
  backdrop-filter: blur(14px);
  color: #ffffff;
  padding: 14px 24px;
  max-width: 90vw;
  border-radius: var(--radius-pill);
  z-index: 60;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
  animation: enter 0.3s ease;
}
.confetti {
  position: fixed;
  top: -20px;
  width: 9px;
  height: 15px;
  z-index: 80;
  pointer-events: none;
  animation: fall 1.8s ease-in forwards;
}
.hidden { display: none !important; }
.help-content { font-size: 14px; line-height: 1.8; }
.help-content h3 { color: var(--ink-pure); margin-top: 26px; font-size: 19px; }
.help-content li { margin-bottom: 10px; }
.filter-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.filter-buttons button {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.2s ease;
}
.filter-buttons button.active {
  background: linear-gradient(135deg, #0f2922 0%, #155e4b 100%);
  border-color: transparent;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(15, 41, 34, 0.15);
}
.check {
  display: flex !important;
  align-items: center;
  gap: 10px;
  font-weight: 600 !important;
  cursor: pointer;
}
.check input { accent-color: var(--green); width: 18px; height: 18px; }
.storage-warning {
  background: #fff0df;
  color: #723e23;
  padding: 12px 20px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
}
.footer {
  border-top: 1px solid var(--line);
  padding: 26px 0 34px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  font-size: 11.5px;
  color: var(--muted);
}

/* Animations */
@keyframes enter {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pop {
  0% { transform: scale(0.7); }
  65% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
@keyframes shake {
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}
@keyframes fall {
  to { transform: translate(var(--drift), 105vh) rotate(600deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after { animation: none !important; transition: none !important; }
}

body {
  font-family: "DM Sans", system-ui, sans-serif;
}
h1, .route-title h2, .side-note b, .empty h3, .settings h2 {
  font-family: "Fraunces", Georgia, serif !important;
}
.question {
  font-family: "DM Sans", system-ui, sans-serif !important;
}
.icon {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Tablet */
@media(max-width: 960px) and (min-width: 601px) {
  .layout { grid-template-columns: 210px minmax(0, 1fr); gap: 24px; }
  .hero { gap: 28px; }
  .hero-art { height: 280px; }
  .chapters { grid-template-columns: 1fr; }
  .stat { padding: 18px 16px 18px 52px; }
  .stat .stat-icon { left: 14px; }
}

/* Mobile */
@media(max-width: 600px) {
  html { scroll-padding-top: 78px; }
  body { padding-bottom: calc(90px + env(safe-area-inset-bottom)); overflow-wrap: break-word; }
  body.in-quiz, body:has(.quiz-card) { padding-bottom: calc(16px + env(safe-area-inset-bottom)) !important; }
  
  .wrap { padding: 0 18px; }
  .top .wrap { min-height: 72px; gap: 8px; }
  .brand { font-size: 16px; gap: 10px; }
  .brand small { font-size: 7.5px; }
  .brand-icon { width: 38px; height: 38px; border-radius: 12px; }
  .brand-icon .icon { width: 22px; height: 22px; }
  .top-actions .pill { display: none; }
  .help-label { display: none; }
  .help-button { width: 42px; height: 42px; padding: 0; justify-content: center; }
  
  .hero { display: flex; flex-direction: column; align-items: stretch; gap: 24px; padding: 28px 0 24px; }
  .hero h1 { font-size: clamp(34px, 9vw, 44px); margin: 12px 0; }
  .hero p { font-size: 14.5px; max-width: none; }
  .hero-art { height: auto; aspect-ratio: 1.6; border-radius: 20px; }
  
  .stats {
    margin: 0 0 28px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    border-radius: 18px;
  }
  .stat { padding: 16px 14px 16px 48px; min-height: 80px; }
  .stat .stat-icon { left: 12px; top: 16px; width: 28px; height: 28px; }
  .stat .stat-icon .icon { width: 18px; height: 18px; }
  .stat b { font-size: 25px; }
  .stat:nth-child(even) { border-right: 0; }
  .stat:nth-child(odd) { border-right: 1.5px solid var(--line); }
  .stat:nth-child(-n+2) { border-bottom: 1.5px solid var(--line); }
  
  .layout { display: block; padding-bottom: 8px; }
  .side { margin: 0; }
  .side-note, .side .mini-progress { display: none; }
  
  /* Mobile Bottom Navigation Dock */
  .sidebox.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 30;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: 8px max(10px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    gap: 4px;
    border: 0;
    border-top: 1.5px solid rgba(225, 231, 226, 0.95);
    background: rgba(255, 255, 255, 0.93);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -8px 30px rgba(15, 41, 34, 0.08);
  }
  .sidebox.nav h2 { display: none; }
  .navbtn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-width: 0;
    width: 100%;
    gap: 4px;
    margin: 0;
    padding: 8px 4px 6px;
    border-radius: 14px;
    font-size: 10.5px;
    font-weight: 750;
    min-height: 58px;
    line-height: 1.2;
    transform: none !important;
  }
  .navbtn.active {
    background: #ecfdf5;
    color: #059669;
    box-shadow: none;
  }
  .navbtn .count {
    position: absolute;
    top: 4px;
    left: calc(50% + 8px);
    margin: 0;
    font-size: 8px;
    min-width: 16px;
    line-height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: #0f2922;
    color: #ffffff;
  }
  .navbtn.active .count {
    background: #059669;
    color: #ffffff;
  }
  
  .route-title h2 { font-size: 28px; }
  .tools { flex-direction: column; gap: 10px; margin: 18px 0; }
  input[type=search], select { font-size: 16px; padding: 13px 15px; border-radius: 14px; min-height: 48px; }
  .ranges select { font-size: 16px; padding: 12px 10px; }
  .chapters { grid-template-columns: 1fr; gap: 14px; }
  .chapter { padding: 20px; border-radius: 18px; }
  .chapter h3 { font-size: 16px; margin: 8px 0 16px; }
  
  .quiz-shell { margin: 16px auto 24px; max-width: 100%; }
  .quiz-card { padding: 24px 18px 0; border-radius: 20px; }
  .question { font-size: clamp(21px, 5.8vw, 25px); margin: 0 0 20px; }
  .option { font-size: 14.5px; padding: 15px 14px; gap: 12px; border-radius: 14px; }
  .option:hover { transform: none; }
  .option:active { transform: scale(0.99); }
  
  /* Sticky Quiz Actions in Quiz View */
  .quiz-actions {
    position: sticky;
    bottom: 0;
    z-index: 10;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    margin: 22px -18px 0;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    border-top: 1.5px solid var(--line);
    border-radius: 0 0 20px 20px;
    gap: 10px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  }

<script id="quiz-data" type="application/json">[{"n": 1, "title": "Una vida demasiado ordenada", "summary": "Huck cuenta su historia. La viuda Douglas intenta educarlo y él extraña su libertad. Tom lo busca de noche.", "questions": [{"id": "1-1", "chapter": 1, "q": "¿Quién narra la historia?", "options": ["Huckleberry Finn", "Tom Sawyer", "La viuda Douglas", "El juez Thatcher"], "explanation": "Huck cuenta lo que vive y piensa en primera persona. Su mirada permite comparar lo que cree con lo que el lector comprende.", "hint": "Recordá las diferencias entre las costumbres de Huck y las de la casa de la viuda."}, {"id": "1-2", "chapter": 1, "q": "¿De dónde proviene la fortuna de Huck y Tom?", "options": ["De un tesoro de ladrones hallado en una cueva", "De una herencia de la señorita Watson", "De la venta de una granja", "De una recompensa por rescatar un barco"], "explanation": "El comienzo recuerda el tesoro encontrado en Las aventuras de Tom Sawyer: a cada chico le corresponden seis mil dólares.", "hint": "Recordá las diferencias entre las costumbres de Huck y las de la casa de la viuda."}, {"id": "1-3", "chapter": 1, "q": "¿Quién intenta darle a Huck una vida ordenada y educación?", "options": ["La viuda Douglas", "Judith Loftus", "Mary Jane Wilks", "La tía Sally"], "explanation": "La viuda lo recibe en su casa e intenta acostumbrarlo a la ropa, los horarios y los modales que considera adecuados.", "hint": "Recordá las diferencias entre las costumbres de Huck y las de la casa de la viuda."}, {"id": "1-4", "chapter": 1, "q": "¿Qué parentesco tiene la señorita Watson con la viuda?", "options": ["Es su hermana", "Es su hija", "Es su madre", "Es su sobrina"], "explanation": "La señorita Watson es hermana de la viuda Douglas y también participa en la educación de Huck.", "hint": "Recordá las diferencias entre las costumbres de Huck y las de la casa de la viuda."}, {"id": "1-5", "chapter": 1, "q": "¿Qué señal usa Tom para llamar a Huck por la noche?", "options": ["Imita un maullido", "Toca una campana", "Dispara al aire", "Golpea la puerta principal"], "explanation": "Huck oye un maullido, responde del mismo modo y sale por la ventana para encontrarse con Tom.", "hint": "Recordá las diferencias entre las costumbres de Huck y las de la casa de la viuda."}]}, {"n": 2, "title": "La pandilla de Tom", "summary": "Tom y Huck pasan junto a Jim. Después, los chicos forman una pandilla con reglas tomadas de novelas de aventuras.", "questions": [{"id": "2-1", "chapter": 2, "q": "¿Qué hace Tom con el sombrero de Jim mientras este duerme?", "options": ["Lo cuelga en una rama sobre su cabeza", "Lo arroja al río", "Lo esconde en una cueva", "Se lo entrega a la viuda"], "explanation": "La broma del sombrero da pie a que Jim interprete el episodio como una visita de brujas.", "hint": "Pensá qué elementos de la pandilla vienen de las lecturas de Tom."}, {"id": "2-2", "chapter": 2, "q": "¿Cómo explica Jim el extraño episodio del sombrero?", "options": ["Dice que lo llevaron las brujas", "Dice que vino el juez", "Dice que lo atacó Pap", "Dice que lo robó un marinero"], "explanation": "Jim atribuye la broma a las brujas y su relato crece a medida que lo cuenta.", "hint": "Pensá qué elementos de la pandilla vienen de las lecturas de Tom."}, {"id": "2-3", "chapter": 2, "q": "¿Qué organización crean los chicos?", "options": ["Una pandilla de ladrones imaginaria", "Un club de pescadores profesionales", "Una escuela de navegación", "Un grupo de comerciantes"], "explanation": "La pandilla imita a los bandidos de los libros. Sus planes grandiosos son juegos infantiles.", "hint": "Pensá qué elementos de la pandilla vienen de las lecturas de Tom."}, {"id": "2-4", "chapter": 2, "q": "¿De dónde toma Tom las reglas de la pandilla?", "options": ["De libros de aventuras", "De un código judicial", "De cartas de su padre", "De instrucciones del juez"], "explanation": "Tom trata las convenciones de las novelas como si fueran reglas obligatorias de la vida real.", "hint": "Pensá qué elementos de la pandilla vienen de las lecturas de Tom."}, {"id": "2-5", "chapter": 2, "q": "¿A quién ofrece Huck como familiar para el juramento de la pandilla?", "options": ["A la señorita Watson", "A su madre", "A Mary Jane", "A la tía Sally"], "explanation": "Como los chicos objetan que Huck casi no tiene familia disponible para su juramento, él propone a la señorita Watson.", "hint": "Pensá qué elementos de la pandilla vienen de las lecturas de Tom."}]}, {"n": 3, "title": "Fantasías y dudas", "summary": "Huck prueba la oración de manera literal. La pandilla no realiza los grandes asaltos que Tom imagina.", "questions": [{"id": "3-1", "chapter": 3, "q": "¿Qué dificultad encuentra Huck al intentar rezar por objetos?", "options": ["No obtiene los anzuelos que pide", "Pierde la fortuna del juez", "Olvida el nombre de Tom", "Recibe demasiados alimentos"], "explanation": "Huck entiende la oración como un pedido de cosas concretas y se desconcierta cuando no funciona de esa manera.", "hint": "Separá lo que Tom anuncia de lo que los chicos encuentran realmente."}, {"id": "3-2", "chapter": 3, "q": "¿Qué ocurre con las grandes aventuras de la pandilla?", "options": ["Se reducen a juegos y ataques imaginarios", "Se convierten en robos de bancos", "Terminan con Tom preso", "Producen una gran fortuna"], "explanation": "Los chicos no realizan los crímenes que anunciaban: la distancia entre fantasía y realidad desilusiona a Huck.", "hint": "Separá lo que Tom anuncia de lo que los chicos encuentran realmente."}, {"id": "3-3", "chapter": 3, "q": "¿Qué encuentran realmente donde Tom anuncia árabes y elefantes?", "options": ["Una excursión de escuela dominical", "Una patrulla de soldados", "Una feria de ganado", "Un campamento de ladrones"], "explanation": "Tom transforma una reunión de niños y maestros en una aventura fantástica; Huck observa lo que hay de verdad.", "hint": "Separá lo que Tom anuncia de lo que los chicos encuentran realmente."}, {"id": "3-4", "chapter": 3, "q": "¿Cómo justifica Tom que no se vean las maravillas que prometió?", "options": ["Afirma que intervinieron encantadores", "Admite que el juez las compró", "Dice que llegaron en otro tren", "Explica que las escondió Jim"], "explanation": "Tom recurre a encantamientos para sostener su fantasía cuando los hechos no la confirman.", "hint": "Separá lo que Tom anuncia de lo que los chicos encuentran realmente."}, {"id": "3-5", "chapter": 3, "q": "¿Qué concluye Huck al frotar una lámpara y un anillo sin resultado?", "options": ["Que los genios de Tom no aparecen en la realidad", "Que debe comprar una balsa", "Que su padre volvió a casa", "Que la viuda escondió el tesoro"], "explanation": "Huck prueba por sí mismo la historia de los genios y termina desconfiando de las explicaciones de Tom.", "hint": "Separá lo que Tom anuncia de lo que los chicos encuentran realmente."}]}, {"n": 4, "title": "La huella en la nieve", "summary": "Una huella anuncia el regreso del padre de Huck. El chico pone su dinero a resguardo y consulta a Jim.", "questions": [{"id": "4-1", "chapter": 4, "q": "¿Qué detalle de una huella preocupa a Huck?", "options": ["Una cruz de clavos en el talón", "Una estrella dibujada al lado", "Una suela cubierta de pintura", "Una herradura junto al pie"], "explanation": "Huck reconoce la marca de la bota de su padre y teme que haya vuelto para buscarlo y quedarse con su dinero.", "hint": "La señal en la huella conecta el dinero de Huck con un peligro familiar."}, {"id": "4-2", "chapter": 4, "q": "¿Qué le propone Huck al juez Thatcher para proteger su fortuna?", "options": ["Venderle sus bienes por un dólar", "Enterrar todo en la isla", "Comprar una casa para Pap", "Enviar el dinero a Tom"], "explanation": "Huck presenta la operación como una venta para que su padre no pueda exigirle el dinero directamente.", "hint": "La señal en la huella conecta el dinero de Huck con un peligro familiar."}, {"id": "4-3", "chapter": 4, "q": "¿A quién consulta Huck para conocer su porvenir?", "options": ["A Jim", "A Boggs", "Al duque", "Al doctor Robinson"], "explanation": "Jim utiliza sus creencias y prácticas de adivinación para interpretar lo que puede sucederle a Huck.", "hint": "La señal en la huella conecta el dinero de Huck con un peligro familiar."}, {"id": "4-4", "chapter": 4, "q": "¿Qué objeto usa Jim para adivinar?", "options": ["Una bola de pelo de un buey", "Un reloj de oro", "Un espejo roto", "Una baraja del juez"], "explanation": "La bola de pelo es el objeto al que Jim atribuye el poder de comunicar predicciones.", "hint": "La señal en la huella conecta el dinero de Huck con un peligro familiar."}, {"id": "4-5", "chapter": 4, "q": "¿A quién encuentra Huck en su habitación al final del capítulo?", "options": ["A su padre", "A Tom", "A Silas Phelps", "A Harvey Wilks"], "explanation": "La huella anticipaba su regreso: al volver a su habitación, Huck encuentra allí a Pap.", "hint": "La señal en la huella conecta el dinero de Huck con un peligro familiar."}]}, {"n": 5, "title": "El regreso de Pap", "summary": "Pap exige dinero, rechaza la educación de Huck y aparenta reformarse ante un nuevo juez.", "questions": [{"id": "5-1", "chapter": 5, "q": "¿Por qué a Pap le molesta que Huck sepa leer?", "options": ["Porque no quiere que su hijo se considere superior a él", "Porque quiere que estudie francés", "Porque necesita vender los libros", "Porque el juez le prohibió leer"], "explanation": "Pap ve la educación de Huck como una amenaza a su autoridad y le ordena abandonar la escuela.", "hint": "No confundas al juez Thatcher con el nuevo juez que intenta reformar a Pap."}, {"id": "5-2", "chapter": 5, "q": "¿Qué desea obtener Pap de Huck?", "options": ["Su dinero", "Una carta de Jim", "Un terreno en Inglaterra", "Un puesto en el circo"], "explanation": "El interés de Pap por la fortuna del chico acompaña su conducta violenta y su consumo de alcohol.", "hint": "No confundas al juez Thatcher con el nuevo juez que intenta reformar a Pap."}, {"id": "5-3", "chapter": 5, "q": "¿Qué postura adopta el nuevo juez ante la separación de padre e hijo?", "options": ["Se resiste a separarlos por el vínculo familiar", "Ordena que Huck se vaya con Jim", "Entrega a Huck a Mary Jane", "Expulsa a Pap del país"], "explanation": "El nuevo juez prioriza el parentesco y no comprende inicialmente la gravedad del peligro que corre Huck.", "hint": "No confundas al juez Thatcher con el nuevo juez que intenta reformar a Pap."}, {"id": "5-4", "chapter": 5, "q": "¿Cómo se comporta Pap ante el intento del nuevo juez de reformarlo?", "options": ["Promete cambiar y parece arrepentido", "Se marcha sin escuchar", "Pide estudiar medicina", "Devuelve todo el dinero al juez"], "explanation": "Pap conmueve al juez con promesas de reforma que sus actos posteriores desmienten.", "hint": "No confundas al juez Thatcher con el nuevo juez que intenta reformar a Pap."}, {"id": "5-5", "chapter": 5, "q": "¿Qué demuestra la recaída de Pap esa misma noche?", "options": ["Que sus promesas no significaron un cambio real", "Que Huck inventó todas las agresiones", "Que la escuela provocaba su enfermedad", "Que Jim le había robado el dinero"], "explanation": "Pap vuelve a beber, destroza la habitación y se lastima al caer: la reforma sentimental del juez fracasa.", "hint": "No confundas al juez Thatcher con el nuevo juez que intenta reformar a Pap."}]}, {"n": 6, "title": "Encerrado en la cabaña", "summary": "Pap se lleva a Huck a una cabaña y lo encierra. El peligro aumenta y Huck prepara una salida.", "questions": [{"id": "6-1", "chapter": 6, "q": "¿Adónde lleva Pap a Huck?", "options": ["A una cabaña apartada junto al río", "A la casa de los Wilks", "A una escuela de Illinois", "Al barco de un comerciante"], "explanation": "Pap lo aparta de la viuda y lo mantiene bajo su control en una cabaña aislada.", "hint": "Pensá por qué la libertad de vivir en el bosque no compensa la violencia de Pap."}, {"id": "6-2", "chapter": 6, "q": "¿Qué hace Pap cuando deja solo a Huck?", "options": ["Lo encierra con llave", "Lo deja al cuidado de Tom", "Lo envía con el juez", "Lo lleva a la iglesia"], "explanation": "El encierro impide que Huck salga libremente y vuelve necesaria una fuga preparada en secreto.", "hint": "Pensá por qué la libertad de vivir en el bosque no compensa la violencia de Pap."}, {"id": "6-3", "chapter": 6, "q": "¿Con qué comienza Huck a preparar una abertura para escapar?", "options": ["Con una vieja sierra", "Con una pala del juez", "Con un cuchillo de Tom", "Con un hacha de Jim"], "explanation": "Huck encuentra una sierra y trabaja en una parte de la pared que puede ocultar para que Pap no descubra su plan.", "hint": "Pensá por qué la libertad de vivir en el bosque no compensa la violencia de Pap."}, {"id": "6-4", "chapter": 6, "q": "¿Qué contradicción muestra el discurso político de Pap?", "options": ["Reclama derechos para sí mientras desprecia los de un hombre negro libre", "Defiende la escuela pero prohíbe la pesca", "Critica la riqueza pero regala su fortuna", "Rechaza el alcohol pero trabaja en una taberna"], "explanation": "Su indignación ante un hombre negro educado y con derecho a votar expone su racismo y su hipocresía.", "hint": "Pensá por qué la libertad de vivir en el bosque no compensa la violencia de Pap."}, {"id": "6-5", "chapter": 6, "q": "¿Qué hace Pap durante un episodio de delirio alcohólico?", "options": ["Persigue a Huck con un cuchillo", "Libera a Jim de sus cadenas", "Se entrega al juez Thatcher", "Regala la cabaña a la viuda"], "explanation": "El ataque transforma el encierro en un peligro inmediato para la vida del chico.", "hint": "Pensá por qué la libertad de vivir en el bosque no compensa la violencia de Pap."}]}, {"n": 7, "title": "La gran fuga", "summary": "Huck aprovecha una ausencia de Pap, simula su propia muerte y llega a la isla de Jackson.", "questions": [{"id": "7-1", "chapter": 7, "q": "¿Qué embarcación encuentra Huck y oculta para su fuga?", "options": ["Una canoa a la deriva", "Un vapor abandonado", "Una balsa de los Wilks", "Un bote del juez"], "explanation": "La canoa le permite planear una huida independiente sin que Pap advierta sus preparativos.", "hint": "La fuga combina una salida secreta, pistas falsas y una embarcación escondida."}, {"id": "7-2", "chapter": 7, "q": "¿Qué simula Huck para evitar que lo busquen como fugitivo?", "options": ["Su propio asesinato", "Un viaje autorizado por la viuda", "Una enfermedad contagiosa", "Una mudanza con Tom"], "explanation": "Huck quiere que crean que está muerto, de modo que ni su padre ni la viuda intenten devolverlo a su vida anterior.", "hint": "La fuga combina una salida secreta, pistas falsas y una embarcación escondida."}, {"id": "7-3", "chapter": 7, "q": "¿Qué utiliza para dejar rastros de sangre?", "options": ["Un cerdo que mata", "Un frasco de pintura", "Un animal muerto que compra", "Una herida en su brazo"], "explanation": "La sangre del cerdo forma parte de la escena falsa que Huck prepara en la cabaña.", "hint": "La fuga combina una salida secreta, pistas falsas y una embarcación escondida."}, {"id": "7-4", "chapter": 7, "q": "¿Para qué arrastra un saco con piedras hasta el río?", "options": ["Para simular el traslado de un cuerpo", "Para construir una presa", "Para cargar una balsa nueva", "Para esconder las joyas de la viuda"], "explanation": "Las marcas de arrastre refuerzan la apariencia de un asesinato y de que el cuerpo fue arrojado al agua.", "hint": "La fuga combina una salida secreta, pistas falsas y una embarcación escondida."}, {"id": "7-5", "chapter": 7, "q": "¿Dónde se refugia Huck tras escapar?", "options": ["En la isla de Jackson", "En la granja Phelps", "En la casa de los Grangerford", "En una pensión de Cairo"], "explanation": "La isla de Jackson, cercana a su pueblo, le ofrece un escondite conocido al que llega en canoa.", "hint": "La fuga combina una salida secreta, pistas falsas y una embarcación escondida."}]}, {"n": 8, "title": "Huck encuentra a Jim", "summary": "Mientras el pueblo busca su supuesto cadáver, Huck descubre a Jim en la isla. Jim también escapó.", "questions": [{"id": "8-1", "chapter": 8, "q": "¿Para qué disparan un cañón desde la embarcación de búsqueda?", "options": ["Para intentar hacer subir un cadáver a la superficie", "Para saludar a un gobernador", "Para espantar a una pandilla", "Para iniciar una carrera"], "explanation": "Los buscadores creen que las explosiones pueden ayudar a localizar el cuerpo del supuesto ahogado.", "hint": "Los dos se esconden, pero el peligro y las razones de cada fuga son diferentes."}, {"id": "8-2", "chapter": 8, "q": "¿Qué alimento recoge Huck del río durante la búsqueda?", "options": ["Un pan usado para buscar al ahogado", "Una bolsa de manzanas de Jim", "Un pastel de Mary Jane", "Un pescado del juez"], "explanation": "Se arrojan panes con mercurio según una creencia de búsqueda de ahogados. Huck aprovecha uno para comer.", "hint": "Los dos se esconden, pero el peligro y las razones de cada fuga son diferentes."}, {"id": "8-3", "chapter": 8, "q": "¿Cómo reacciona Jim cuando ve a Huck por primera vez en la isla?", "options": ["Cree que está viendo su espíritu", "Lo acusa de trabajar para Pap", "Le exige volver a la escuela", "Le anuncia que Tom murió"], "explanation": "Jim también oyó hablar de la muerte de Huck, por eso al principio cree que se le aparece un fantasma.", "hint": "Los dos se esconden, pero el peligro y las razones de cada fuga son diferentes."}, {"id": "8-4", "chapter": 8, "q": "¿Por qué ha escapado Jim?", "options": ["Oyó que la señorita Watson pensaba venderlo río abajo", "Quería trabajar para el duque", "Había perdido el tesoro de Tom", "El juez lo mandó a buscar a Huck"], "explanation": "La posible venta amenaza con separarlo de su familia y llevarlo a condiciones de esclavitud aún peores.", "hint": "Los dos se esconden, pero el peligro y las razones de cada fuga son diferentes."}, {"id": "8-5", "chapter": 8, "q": "¿Qué le promete Huck a Jim?", "options": ["No revelar su fuga", "Entregarlo a la viuda", "Vender la isla para ayudarlo", "Escribir inmediatamente a Watson"], "explanation": "Huck acepta guardar el secreto, aun cuando la sociedad esclavista le ha enseñado a condenar esa ayuda.", "hint": "Los dos se esconden, pero el peligro y las razones de cada fuga son diferentes."}]}, {"n": 9, "title": "La casa flotante", "summary": "La creciente lleva a Huck y Jim a una cueva. Una casa arrastrada por el río contiene objetos útiles y un cadáver.", "questions": [{"id": "9-1", "chapter": 9, "q": "¿Por qué Jim propone llevar las provisiones a la cueva?", "options": ["Para protegerlas de la lluvia y la creciente", "Para venderlas a un comerciante", "Para esconderlas de Tom", "Para preparar una fiesta"], "explanation": "La cueva está en una zona elevada de la isla y ofrece un refugio más seguro ante el mal tiempo.", "hint": "Prestá atención a la actitud protectora de Jim ante el hombre muerto."}, {"id": "9-2", "chapter": 9, "q": "¿Qué cambio del río rodea este episodio?", "options": ["Una gran creciente", "Una sequía que lo vacía", "Una helada que lo congela", "Un desvío construido por el juez"], "explanation": "El agua sube, inunda partes de la isla y arrastra objetos y construcciones.", "hint": "Prestá atención a la actitud protectora de Jim ante el hombre muerto."}, {"id": "9-3", "chapter": 9, "q": "¿Qué encuentran Huck y Jim flotando?", "options": ["Una casa de madera", "Una iglesia de piedra", "Un tren de carga", "Un palacio del rey"], "explanation": "Entran en una casa arrastrada por la creciente y recuperan distintos objetos.", "hint": "Prestá atención a la actitud protectora de Jim ante el hombre muerto."}, {"id": "9-4", "chapter": 9, "q": "¿Qué hace Jim cuando descubre al hombre muerto?", "options": ["Impide que Huck le mire la cara", "Le pide a Huck que lo identifique", "Lo lleva a la viuda", "Lo sienta para hablarle"], "explanation": "Jim cubre el cadáver y evita que Huck lo vea de cerca; el motivo completo se sabrá al final de la novela.", "hint": "Prestá atención a la actitud protectora de Jim ante el hombre muerto."}, {"id": "9-5", "chapter": 9, "q": "¿Por qué Huck pide a Jim que se cubra durante el regreso?", "options": ["Para que no lo identifiquen desde la orilla", "Para ensayar una obra teatral", "Para imitar un fantasma", "Para proteger el dinero del juez"], "explanation": "Huck sabe que Jim corre peligro si alguien lo reconoce como una persona esclavizada que ha escapado.", "hint": "Prestá atención a la actitud protectora de Jim ante el hombre muerto."}]}, {"n": 10, "title": "Una broma peligrosa", "summary": "Una serpiente muerde a Jim por una broma de Huck. Después, Huck se disfraza para averiguar noticias del pueblo.", "questions": [{"id": "10-1", "chapter": 10, "q": "¿Dónde encuentran ocho dólares?", "options": ["Cosidos en el forro de un abrigo", "Dentro de la bola de pelo", "En un pez del río", "Bajo el sombrero de Tom"], "explanation": "Al revisar la ropa de la casa flotante, descubren monedas escondidas en un abrigo.", "hint": "Relacioná la broma con la consecuencia que Huck no había previsto."}, {"id": "10-2", "chapter": 10, "q": "¿Qué broma le hace Huck a Jim?", "options": ["Deja una serpiente muerta junto a su lugar de dormir", "Le esconde la comida en el pueblo", "Lo ata a la balsa de noche", "Le cambia el nombre ante el juez"], "explanation": "Huck espera asustarlo con el animal muerto y no piensa en el riesgo de que se acerque otra serpiente.", "hint": "Relacioná la broma con la consecuencia que Huck no había previsto."}, {"id": "10-3", "chapter": 10, "q": "¿Por qué la broma termina en una mordedura?", "options": ["Otra serpiente se acerca a la muerta", "Jim intenta comerse la serpiente", "Tom trae una serpiente al refugio", "La serpiente muerta revive"], "explanation": "La compañera de la serpiente muerta se enrosca cerca y muerde a Jim cuando este se acuesta.", "hint": "Relacioná la broma con la consecuencia que Huck no había previsto."}, {"id": "10-4", "chapter": 10, "q": "¿Qué consecuencia tiene la mordedura para Jim?", "options": ["Pasa varios días con dolor e hinchazón", "Pierde la memoria de su familia", "Debe abandonar la isla de inmediato", "Deja de poder reconocer a Huck"], "explanation": "El episodio muestra que una diversión de Huck puede causar sufrimiento real a su compañero.", "hint": "Relacioná la broma con la consecuencia que Huck no había previsto."}, {"id": "10-5", "chapter": 10, "q": "¿Cómo va Huck al pueblo para buscar noticias?", "options": ["Disfrazado de muchacha", "Vestido de predicador", "Con un uniforme militar", "Fingiendo ser el juez"], "explanation": "Usa ropa obtenida en la casa flotante e intenta ocultar su identidad ante una mujer recién llegada.", "hint": "Relacioná la broma con la consecuencia que Huck no había previsto."}]}, {"n": 11, "title": "Judith Loftus descubre el disfraz", "summary": "Judith sospecha que Huck es un chico. Le revela que planean buscar a Jim en la isla y Huck vuelve para advertirle.", "questions": [{"id": "11-1", "chapter": 11, "q": "¿Qué nombre femenino usa Huck al principio de la visita?", "options": ["Sarah Williams", "Mary Jane Wilks", "Sally Phelps", "Emmeline Grangerford"], "explanation": "Huck empieza presentándose como Sarah Williams, pero luego se contradice al dar otro nombre.", "hint": "La mujer detecta contradicciones y observa cómo Huck maneja objetos."}, {"id": "11-2", "chapter": 11, "q": "¿Qué ayuda a Judith Loftus a descubrir el disfraz?", "options": ["Las contradicciones y la forma de coser, lanzar y atrapar objetos", "Una carta de la viuda", "El reconocimiento de Tom", "Una fotografía de Pap"], "explanation": "Judith combina las inconsistencias del relato con gestos que interpreta como propios de un chico.", "hint": "La mujer detecta contradicciones y observa cómo Huck maneja objetos."}, {"id": "11-3", "chapter": 11, "q": "¿A quién sospechan algunas personas de haber matado a Huck?", "options": ["A Jim", "A Mary Jane", "A la tía Polly", "Al coronel Grangerford"], "explanation": "La fuga de Jim alimenta las sospechas injustas sobre él; también se ha sospechado de Pap.", "hint": "La mujer detecta contradicciones y observa cómo Huck maneja objetos."}, {"id": "11-4", "chapter": 11, "q": "¿Qué dato pone a Jim en peligro inmediato?", "options": ["Planean registrar la isla de Jackson esa noche", "Tom anunció un examen escolar", "La viuda compró una balsa", "El río dejó de tener corriente"], "explanation": "El marido de Judith y otro hombre quieren buscar en la isla, donde han visto señales de una fogata.", "hint": "La mujer detecta contradicciones y observa cómo Huck maneja objetos."}, {"id": "11-5", "chapter": 11, "q": "¿Qué hace Huck después de escuchar el plan?", "options": ["Vuelve y escapa de la isla con Jim", "Ayuda a organizar la búsqueda", "Se instala con Judith", "Entrega la canoa al juez"], "explanation": "Huck despierta a Jim y ambos parten de noche en la balsa, sin perder tiempo.", "hint": "La mujer detecta contradicciones y observa cómo Huck maneja objetos."}]}, {"n": 12, "title": "El naufragio del Walter Scott", "summary": "Huck y Jim viajan de noche. Huck explora un vapor encallado y descubre una disputa entre delincuentes.", "questions": [{"id": "12-1", "chapter": 12, "q": "¿Cómo suelen avanzar Huck y Jim para evitar que los descubran?", "options": ["Navegan de noche y se esconden de día", "Viajan siempre junto al ferry", "Piden escolta a la policía", "Caminan por la carretera principal"], "explanation": "Su rutina busca reducir encuentros con personas que podrían capturar a Jim.", "hint": "La curiosidad de Huck los lleva a una embarcación de la que luego resulta difícil salir."}, {"id": "12-2", "chapter": 12, "q": "¿Cómo se llama el vapor naufragado que exploran?", "options": ["Walter Scott", "Royal Nonesuch", "Jackson", "Cairo"], "explanation": "El Walter Scott es un vapor encallado que Huck quiere explorar como una aventura.", "hint": "La curiosidad de Huck los lleva a una embarcación de la que luego resulta difícil salir."}, {"id": "12-3", "chapter": 12, "q": "¿Quién insiste en explorar el naufragio?", "options": ["Huck", "Jim", "La viuda", "El juez"], "explanation": "Jim considera el lugar peligroso; Huck se deja llevar por la curiosidad y por su idea de aventura.", "hint": "La curiosidad de Huck los lleva a una embarcación de la que luego resulta difícil salir."}, {"id": "12-4", "chapter": 12, "q": "¿Qué descubre Huck dentro del vapor?", "options": ["Delincuentes que discuten cómo deshacerse de un cómplice", "Los hermanos Wilks buscando su herencia", "A Tom preparando una obra", "A Pap tratando de vender la canoa"], "explanation": "Los hombres planean dejar que el cómplice muera al hundirse el barco, en lugar de matarlo directamente.", "hint": "La curiosidad de Huck los lleva a una embarcación de la que luego resulta difícil salir."}, {"id": "12-5", "chapter": 12, "q": "¿Qué problema descubren cuando quieren volver a la balsa?", "options": ["La balsa se ha soltado y se fue", "La canoa pertenece al juez", "Jim perdió la capacidad de nadar", "Tom cortó todos los remos"], "explanation": "Sin la balsa, Huck y Jim quedan atrapados en un naufragio ocupado por delincuentes.", "hint": "La curiosidad de Huck los lleva a una embarcación de la que luego resulta difícil salir."}]}, {"n": 13, "title": "Escapar y tratar de ayudar", "summary": "Huck y Jim toman el bote de los delincuentes. Huck inventa un relato para que envíen ayuda al naufragio.", "questions": [{"id": "13-1", "chapter": 13, "q": "¿En qué logran salir del naufragio?", "options": ["En el bote de los delincuentes", "En el vapor reparado", "En una barca de Tom", "En una balsa del juez"], "explanation": "Se llevan el bote que los delincuentes iban a usar y consiguen escapar del Walter Scott.", "hint": "El capítulo combina la necesidad de salvarse con la preocupación de Huck por otros."}, {"id": "13-2", "chapter": 13, "q": "¿Por qué Huck se inquieta después de salir?", "options": ["Porque los delincuentes pueden morir abandonados", "Porque dejó su tarea escolar", "Porque Jim quiere volver con Watson", "Porque el rey perdió su corona"], "explanation": "Huck piensa que, aunque sean criminales, no quiere dejarlos morir sin intentar ayudarlos.", "hint": "El capítulo combina la necesidad de salvarse con la preocupación de Huck por otros."}, {"id": "13-3", "chapter": 13, "q": "¿Qué hace para conseguir un rescate?", "options": ["Inventa una historia sobre personas atrapadas", "Confiesa su identidad al juez", "Compra un vapor nuevo", "Llama a Tom desde la isla"], "explanation": "Huck miente a un hombre de la zona del ferry y menciona conexiones que podrían interesarlo para que mande ayuda.", "hint": "El capítulo combina la necesidad de salvarse con la preocupación de Huck por otros."}, {"id": "13-4", "chapter": 13, "q": "¿Qué encuentra Huck al volver a observar el naufragio?", "options": ["Está casi hundido y no recibe respuesta", "Se convirtió en un hotel", "Los delincuentes lo esperan en cubierta", "Pap lo ha llevado a la orilla"], "explanation": "La situación del barco y el silencio sugieren que el intento de rescate ha llegado demasiado tarde.", "hint": "El capítulo combina la necesidad de salvarse con la preocupación de Huck por otros."}, {"id": "13-5", "chapter": 13, "q": "¿Qué rasgo de Huck se destaca al intentar salvar a los delincuentes?", "options": ["Su compasión incluso por personas que actuaron mal", "Su deseo de trabajar para ellos", "Su obediencia absoluta a Pap", "Su ambición de ser juez"], "explanation": "Huck no se limita a salvarse: se preocupa por la vida de otros y trata de actuar.", "hint": "El capítulo combina la necesidad de salvarse con la preocupación de Huck por otros."}]}, {"n": 14, "title": "Reyes, Salomón y lenguas", "summary": "Huck y Jim revisan lo recuperado y discuten historias de reyes, el juicio de Salomón y el idioma francés.", "questions": [{"id": "14-1", "chapter": 14, "q": "¿Qué encuentran entre los bienes recuperados del naufragio?", "options": ["Libros, ropa, mantas y otros objetos", "Una corona auténtica de Francia", "El testamento de Watson", "Las escrituras de la granja Phelps"], "explanation": "Los bienes incluyen libros que dan pie a la conversación de Huck y Jim sobre reyes y aventuras.", "hint": "Distinguí las opiniones de los personajes de los hechos que el libro presenta."}, {"id": "14-2", "chapter": 14, "q": "¿Qué opina Jim de aventuras tan peligrosas como la del vapor?", "options": ["Que prefiere no volver a vivirlas", "Que quiere organizarlas a diario", "Que son mejores que la libertad", "Que no implican ningún riesgo"], "explanation": "Para Jim, la aventura no es un juego: trae peligros concretos para su vida y su libertad.", "hint": "Distinguí las opiniones de los personajes de los hechos que el libro presenta."}, {"id": "14-3", "chapter": 14, "q": "¿Qué episodio del rey Salomón discuten?", "options": ["La propuesta de dividir a un niño en dos", "La construcción de una balsa", "La venta de una corona", "La fuga de un rey por el río"], "explanation": "Huck cuenta el célebre juicio; Jim se centra en el horror de dividir a un niño y rechaza esa supuesta sabiduría.", "hint": "Distinguí las opiniones de los personajes de los hechos que el libro presenta."}, {"id": "14-4", "chapter": 14, "q": "¿En qué se basa principalmente la objeción de Jim a Salomón?", "options": ["En el valor de la vida del niño", "En que el rey no sabía nadar", "En el precio de las espadas", "En que los testigos eran extranjeros"], "explanation": "Jim no acepta que un niño sea tratado como un objeto que se puede repartir.", "hint": "Distinguí las opiniones de los personajes de los hechos que el libro presenta."}, {"id": "14-5", "chapter": 14, "q": "¿Sobre qué idioma discuten al final?", "options": ["El francés", "El latín", "El italiano", "El alemán"], "explanation": "Huck intenta explicar por qué un francés habla de otra manera; Jim responde desde una lógica literal y cotidiana.", "hint": "Distinguí las opiniones de los personajes de los hechos que el libro presenta."}]}, {"n": 15, "title": "La niebla y la disculpa", "summary": "La niebla separa a Huck de Jim. Tras reunirse, Huck le hace creer que todo fue un sueño y luego comprende el daño de su broma.", "questions": [{"id": "15-1", "chapter": 15, "q": "¿Qué destino buscan para dirigirse hacia los estados libres?", "options": ["Cairo, en la confluencia con el Ohio", "Nueva Orleans, en la desembocadura", "La isla de Jackson, al norte", "La granja Phelps, tierra adentro"], "explanation": "Quieren llegar a Cairo, vender la balsa y tomar un vapor que remonte el Ohio hacia estados libres.", "hint": "Lo decisivo es cómo cambia Huck después de escuchar lo que Jim sintió."}, {"id": "15-2", "chapter": 15, "q": "¿Qué provoca la separación de Huck y Jim?", "options": ["La niebla y la corriente", "Un ataque de los Shepherdson", "Una orden del juez", "Una apuesta con el duque"], "explanation": "La mala visibilidad y la corriente separan la canoa de Huck de la balsa de Jim.", "hint": "Lo decisivo es cómo cambia Huck después de escuchar lo que Jim sintió."}, {"id": "15-3", "chapter": 15, "q": "¿Qué intenta hacer creer Huck a Jim cuando se reúnen?", "options": ["Que la separación fue un sueño", "Que Tom iba en la canoa", "Que ya llegaron a Ohio", "Que Pap los sigue en un vapor"], "explanation": "Huck convierte la angustia real de Jim en una broma al negar que se hayan separado.", "hint": "Lo decisivo es cómo cambia Huck después de escuchar lo que Jim sintió."}, {"id": "15-4", "chapter": 15, "q": "¿Qué evidencia demuestra que la separación ocurrió?", "options": ["Restos sobre la balsa y un remo dañado", "Una carta de Mary Jane", "La corona del rey", "Un mapa firmado por Tom"], "explanation": "Los restos del viaje desmienten la historia de Huck y hacen que Jim comprenda la burla.", "hint": "Lo decisivo es cómo cambia Huck después de escuchar lo que Jim sintió."}, {"id": "15-5", "chapter": 15, "q": "¿Qué hace Huck después del reproche de Jim?", "options": ["Le pide disculpas", "Lo abandona en la orilla", "Busca a Watson", "Se ríe con Tom"], "explanation": "Huck supera parte de los prejuicios aprendidos, reconoce el dolor de Jim y se disculpa sin arrepentirse después de haberlo hecho.", "hint": "Lo decisivo es cómo cambia Huck después de escuchar lo que Jim sintió."}]}, {"n": 16, "title": "Una conciencia dividida", "summary": "Huck duda entre entregar a Jim y protegerlo. Evita una inspección y, después de pasar Cairo, un vapor los separa.", "questions": [{"id": "16-1", "chapter": 16, "q": "¿Qué espera hacer Jim cuando consiga la libertad?", "options": ["Trabajar para reunir a su esposa y a sus hijos", "Comprar una corona para el rey", "Volver a encerrar a Huck", "Pedir un empleo a Pap"], "explanation": "Jim desea recuperar la vida con su familia, amenazada por las ventas y separaciones de la esclavitud.", "hint": "La conciencia de Huck todavía repite las reglas de la sociedad esclavista."}, {"id": "16-2", "chapter": 16, "q": "¿Por qué Huck siente culpa al ayudar a Jim?", "options": ["Porque le enseñaron que ayudar a escapar era perjudicar a su dueña", "Porque Jim le robó su dinero", "Porque el juez le ordenó viajar solo", "Porque Tom se quedó sin canoa"], "explanation": "Su conflicto revela la distancia entre una norma social injusta y la amistad que está viviendo.", "hint": "La conciencia de Huck todavía repite las reglas de la sociedad esclavista."}, {"id": "16-3", "chapter": 16, "q": "¿Qué enfermedad sugiere Huck que hay en la balsa para evitar una inspección?", "options": ["Viruela", "Sarampión", "Gripe", "Escarlatina"], "explanation": "Los hombres temen contagiarse de viruela y no se acercan a revisar la balsa, donde está Jim.", "hint": "La conciencia de Huck todavía repite las reglas de la sociedad esclavista."}, {"id": "16-4", "chapter": 16, "q": "¿Qué problema arruina la ruta prevista hacia la libertad?", "options": ["Pasan Cairo sin advertirlo", "El Ohio desemboca en el mar", "El juez cierra todos los puertos", "La viuda compra la ciudad"], "explanation": "Al pasar la confluencia, ya no pueden usar sencillamente la corriente para alcanzar el camino planeado por el Ohio.", "hint": "La conciencia de Huck todavía repite las reglas de la sociedad esclavista."}, {"id": "16-5", "chapter": 16, "q": "¿Qué ocurre al final del capítulo?", "options": ["Un vapor choca la balsa y Huck llega solo a la orilla", "Jim se convierte en capitán", "Huck regresa con la viuda", "Tom rescata a todos del ferry"], "explanation": "El choque vuelve a separar a los protagonistas; Huck nada hasta una orilla donde encuentra una casa.", "hint": "La conciencia de Huck todavía repite las reglas de la sociedad esclavista."}]}, {"n": 17, "title": "En casa de los Grangerford", "summary": "Los Grangerford reciben a Huck, que usa el nombre George Jackson. Conoce a Buck y observa el ambiente familiar.", "questions": [{"id": "17-1", "chapter": 17, "q": "¿Qué nombre falso da Huck a la familia que lo recibe?", "options": ["George Jackson", "Sid Sawyer", "Harvey Wilks", "William Thompson"], "explanation": "Huck se presenta como George Jackson para proteger su identidad tras llegar a la orilla.", "hint": "Prestá atención a los nombres nuevos y al contraste entre comodidad y violencia."}, {"id": "17-2", "chapter": 17, "q": "¿Qué familia le da alojamiento?", "options": ["Los Grangerford", "Los Phelps", "Los Wilks", "Los Shepherdson"], "explanation": "Los Grangerford lo reciben después de asegurarse de que no pertenece a la familia enemiga.", "hint": "Prestá atención a los nombres nuevos y al contraste entre comodidad y violencia."}, {"id": "17-3", "chapter": 17, "q": "¿Con qué muchacho de la familia se hace amigo?", "options": ["Con Buck", "Con Ben Rogers", "Con Sid", "Con Joe Harper"], "explanation": "Buck Grangerford tiene una edad cercana a la de Huck y se convierte en su compañero en la casa.", "hint": "Prestá atención a los nombres nuevos y al contraste entre comodidad y violencia."}, {"id": "17-4", "chapter": 17, "q": "¿Qué temas dominaban las obras de Emmeline?", "options": ["La muerte y el duelo", "Los viajes comerciales", "La agricultura", "Los juegos deportivos"], "explanation": "La hija fallecida pintaba y escribía sobre temas fúnebres; la familia conserva su habitación y sus trabajos.", "hint": "Prestá atención a los nombres nuevos y al contraste entre comodidad y violencia."}, {"id": "17-5", "chapter": 17, "q": "¿Qué ambiente material encuentra Huck en la casa?", "options": ["Una vida cómoda con objetos que considera elegantes", "Una cabaña completamente vacía", "Una cárcel sin ventanas", "Un taller abandonado"], "explanation": "Huck admira la casa y sus comodidades. Esa impresión prepara el contraste con la violencia familiar del capítulo siguiente.", "hint": "Prestá atención a los nombres nuevos y al contraste entre comodidad y violencia."}]}, {"n": 18, "title": "La tragedia de la enemistad", "summary": "La rivalidad entre Grangerford y Shepherdson termina en nuevas muertes. Huck se reúne con Jim y vuelve a la balsa.", "questions": [{"id": "18-1", "chapter": 18, "q": "¿Contra qué familia mantienen una enemistad los Grangerford?", "options": ["Los Shepherdson", "Los Wilks", "Los Phelps", "Los Thatcher"], "explanation": "La rivalidad se transmite entre generaciones, aunque los jóvenes no pueden explicar claramente su origen.", "hint": "Relacioná el sermón, las armas y la fuga de la pareja de familias enemigas."}, {"id": "18-2", "chapter": 18, "q": "¿Qué contradicción se observa durante el oficio religioso?", "options": ["Escuchan un sermón de amor con las armas a mano", "Hablan de pobreza y regalan sus casas", "Prohíben las peleas y liberan a Jim", "Predican silencio y cierran la iglesia"], "explanation": "Ambas familias conservan sus armas mientras escuchan un mensaje de amor fraternal: el contraste expone su hipocresía.", "hint": "Relacioná el sermón, las armas y la fuga de la pareja de familias enemigas."}, {"id": "18-3", "chapter": 18, "q": "¿Qué ayuda Huck a recuperar para Sophia sin entender su importancia?", "options": ["Un libro con una nota de una cita", "Una llave de la cárcel", "Un mapa de la isla", "Una carta del juez"], "explanation": "Sophia le pide su Testamento, donde hay un mensaje con una hora de encuentro; luego escapa con Harney Shepherdson.", "hint": "Relacioná el sermón, las armas y la fuga de la pareja de familias enemigas."}, {"id": "18-4", "chapter": 18, "q": "¿Qué le ocurre a Buck durante el enfrentamiento?", "options": ["Muere por la violencia entre las familias", "Se marcha a Inglaterra", "Se casa con Mary Jane", "Se convierte en juez"], "explanation": "Huck presencia el horror de la pelea y encuentra el cuerpo de Buck, lo que destruye su impresión idealizada de la familia.", "hint": "Relacioná el sermón, las armas y la fuga de la pareja de familias enemigas."}, {"id": "18-5", "chapter": 18, "q": "¿Qué representa para Huck regresar con Jim a la balsa en este momento?", "options": ["Un alivio frente a la violencia de la orilla", "Una condena dictada por el juez", "La obligación de unirse a la enemistad", "La pérdida de toda posibilidad de viajar"], "explanation": "La balsa vuelve a sentirse como un hogar relativamente libre y tranquilo después de la tragedia.", "hint": "Relacioná el sermón, las armas y la fuga de la pareja de familias enemigas."}]}, {"n": 19, "title": "Dos pasajeros sospechosos", "summary": "Huck y Jim disfrutan del río hasta que recogen a dos hombres perseguidos que se presentan como nobles.", "questions": [{"id": "19-1", "chapter": 19, "q": "¿Cómo llegan a la balsa los dos nuevos pasajeros?", "options": ["Huyen de personas que los persiguen", "Los manda el juez Thatcher", "Los contrata Jim en una oficina", "Llegan con la viuda Douglas"], "explanation": "Huck los ayuda a escapar sin conocerlos y luego los lleva a la balsa.", "hint": "Los títulos de estos pasajeros son afirmaciones de los estafadores, no hechos verdaderos."}, {"id": "19-2", "chapter": 19, "q": "¿Qué título se atribuye el hombre más joven?", "options": ["Duque", "Emperador", "Obispo", "Almirante"], "explanation": "Se presenta como un noble despojado de su posición; desde entonces se lo llama el duque.", "hint": "Los títulos de estos pasajeros son afirmaciones de los estafadores, no hechos verdaderos."}, {"id": "19-3", "chapter": 19, "q": "¿Qué pretende ser el hombre mayor?", "options": ["El delfín perdido de Francia", "El hermano del juez Thatcher", "El gobernador de Illinois", "El capitán del Walter Scott"], "explanation": "Afirma ser el heredero de Luis XVI; su supuesta identidad real hace que lo llamen el rey.", "hint": "Los títulos de estos pasajeros son afirmaciones de los estafadores, no hechos verdaderos."}, {"id": "19-4", "chapter": 19, "q": "¿Qué comprende pronto Huck sobre sus títulos?", "options": ["Que ambos son impostores", "Que el rey gobierna Francia", "Que el duque es pariente de Jim", "Que los reconoce la viuda"], "explanation": "Huck identifica a los dos como embusteros, aunque decide no enfrentarlos abiertamente.", "hint": "Los títulos de estos pasajeros son afirmaciones de los estafadores, no hechos verdaderos."}, {"id": "19-5", "chapter": 19, "q": "¿Por qué Huck no discute sus falsas identidades?", "options": ["Quiere evitar peleas y problemas en la balsa", "Desea ser coronado príncipe", "El juez se lo ordenó por carta", "Cree que discutir destruye la balsa"], "explanation": "Su experiencia con Pap le ha enseñado a tolerar a personas difíciles para reducir el conflicto inmediato.", "hint": "Los títulos de estos pasajeros son afirmaciones de los estafadores, no hechos verdaderos."}]}, {"n": 20, "title": "Estafas y un anuncio falso", "summary": "Los impostores aprovechan una reunión religiosa y una imprenta. Un anuncio permitirá justificar la presencia de Jim.", "questions": [{"id": "20-1", "chapter": 20, "q": "¿Qué historia inventa Huck para explicar que viaja con Jim?", "options": ["Una desgracia familiar y un viaje a casa de un tío", "Una misión oficial del gobierno", "Una gira escolar con Tom", "Una compra de ganado en Francia"], "explanation": "Huck construye un relato de pérdidas familiares para ocultar que Jim ha escapado de la esclavitud.", "hint": "Cada impostor convierte una actividad del pueblo en una oportunidad de engaño."}, {"id": "20-2", "chapter": 20, "q": "¿Cómo consigue dinero el rey en una reunión religiosa?", "options": ["Finge ser un pirata arrepentido", "Vende un tesoro verdadero", "Cobra entradas para un circo", "Apuesta a una carrera de barcos"], "explanation": "El rey simula una conversión y pide ayuda para volver a convertir a otros piratas.", "hint": "Cada impostor convierte una actividad del pueblo en una oportunidad de engaño."}, {"id": "20-3", "chapter": 20, "q": "¿Qué lugar utiliza el duque para sus actividades?", "options": ["Una imprenta", "Un hospital", "Un juzgado", "Un colegio"], "explanation": "En la imprenta obtiene dinero y prepara material útil para sus engaños.", "hint": "Cada impostor convierte una actividad del pueblo en una oportunidad de engaño."}, {"id": "20-4", "chapter": 20, "q": "¿Qué documento falso prepara el duque sobre Jim?", "options": ["Un anuncio de fugitivo con recompensa", "Un título de capitán", "Un certificado de matrimonio", "Un pasaporte francés"], "explanation": "El anuncio permite fingir que lo han capturado y lo llevan a cobrar la recompensa.", "hint": "Cada impostor convierte una actividad del pueblo en una oportunidad de engaño."}, {"id": "20-5", "chapter": 20, "q": "¿Para qué les sirve ese anuncio durante el viaje?", "options": ["Para navegar de día fingiendo que Jim es un cautivo capturado", "Para demostrar que Jim ya es libre", "Para reclamar la fortuna de Huck", "Para que Jim compre la balsa"], "explanation": "El engaño reduce las sospechas sobre el grupo, pero obliga a Jim a aparecer atado cuando se acercan extraños.", "hint": "Cada impostor convierte una actividad del pueblo en una oportunidad de engaño."}]}, {"n": 21, "title": "Teatro y violencia en el pueblo", "summary": "Los impostores ensayan Shakespeare. En un pueblo de Arkansas, Sherburn mata a Boggs y una multitud se enfurece.", "questions": [{"id": "21-1", "chapter": 21, "q": "¿Qué autor intentan representar el rey y el duque?", "options": ["William Shakespeare", "Mark Twain", "Miguel de Cervantes", "Charles Dickens"], "explanation": "Preparan escenas de Romeo y Julieta y Ricardo III, y una versión disparatada del monólogo de Hamlet.", "hint": "Separá la representación teatral de la violencia real que observa Huck."}, {"id": "21-2", "chapter": 21, "q": "¿Cómo es la versión del monólogo que recita el duque?", "options": ["Una mezcla desordenada de frases teatrales", "Una traducción fiel del original", "Un texto escrito por Jim", "Una carta del juez"], "explanation": "El duque combina pasajes de distintas obras, lo que vuelve ridículas sus pretensiones culturales.", "hint": "Separá la representación teatral de la violencia real que observa Huck."}, {"id": "21-3", "chapter": 21, "q": "¿Quién es Boggs en este episodio?", "options": ["Un hombre ebrio que insulta y amenaza a Sherburn", "El médico que atiende a Tom", "El verdadero hermano de Peter Wilks", "El dueño de la balsa"], "explanation": "Los vecinos conocen sus amenazas borrachas y las consideran habitualmente inofensivas.", "hint": "Separá la representación teatral de la violencia real que observa Huck."}, {"id": "21-4", "chapter": 21, "q": "¿Qué hace Sherburn después de advertir a Boggs?", "options": ["Le dispara y lo mata", "Le regala dinero para el viaje", "Lo envía a Inglaterra", "Lo contrata como actor"], "explanation": "Sherburn lleva su amenaza a la práctica pese a que otros intentan calmar la situación.", "hint": "Separá la representación teatral de la violencia real que observa Huck."}, {"id": "21-5", "chapter": 21, "q": "¿Qué decide hacer la multitud tras la muerte de Boggs?", "options": ["Intentar linchar a Sherburn", "Elegirlo gobernador", "Acompañarlo al teatro", "Vender la casa de Boggs"], "explanation": "El pueblo pasa del espectáculo de mirar y comentar la muerte al impulso de una venganza colectiva.", "hint": "Separá la representación teatral de la violencia real que observa Huck."}]}, {"n": 22, "title": "La multitud y el espectáculo", "summary": "Sherburn dispersa a la multitud. Huck disfruta de un circo y la mala recepción del teatro impulsa una nueva estafa.", "questions": [{"id": "22-1", "chapter": 22, "q": "¿Cómo enfrenta Sherburn a la multitud?", "options": ["La desafía y denuncia su cobardía colectiva", "Se entrega sin hablar", "Huye disfrazado de mujer", "Le pide ayuda a Jim"], "explanation": "Desde su casa, Sherburn intimida al grupo y sostiene que sus integrantes dependen de la masa para atreverse a actuar.", "hint": "Observá cómo se comporta la gente en grupo y qué la atrae como espectáculo."}, {"id": "22-2", "chapter": 22, "q": "¿Qué termina haciendo la multitud?", "options": ["Se dispersa", "Incendia toda la casa", "Nombra juez a Huck", "Captura al duque"], "explanation": "La seguridad y el desafío de Sherburn desarman el intento de linchamiento.", "hint": "Observá cómo se comporta la gente en grupo y qué la atrae como espectáculo."}, {"id": "22-3", "chapter": 22, "q": "¿A qué espectáculo asiste Huck después?", "options": ["A un circo", "A una ópera francesa", "A una carrera de trenes", "A una subasta de cuadros"], "explanation": "Huck se entusiasma con las destrezas del circo y con un número que al principio toma por un peligro real.", "hint": "Observá cómo se comporta la gente en grupo y qué la atrae como espectáculo."}, {"id": "22-4", "chapter": 22, "q": "¿Qué resulta ser el supuesto borracho que monta un caballo en el circo?", "options": ["Un artista que participa del número", "Pap buscando a Huck", "El juez Thatcher de incógnito", "El verdadero rey de Francia"], "explanation": "El aparente descontrol era una actuación preparada, aunque Huck cree que incluso el director fue
